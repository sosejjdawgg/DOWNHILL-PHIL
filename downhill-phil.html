<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Downhill Phil</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
  canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function () {
"use strict";

var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");
var W = 0, H = 0, DPR = 1;

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);

// ---------------------------------------------------------------------------
// small helpers
// ---------------------------------------------------------------------------
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function randRange(a, b) { return a + Math.random() * (b - a); }
function normalizeAngle(a) {
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}
// frame-rate independent exponential ease: moves `current` toward `target`
function easeTowards(current, target, rate, dt) {
  var t = 1 - Math.exp(-rate * dt);
  return current + (target - current) * t;
}

// ===========================================================================
// 1. TUNING — every physics/feel constant lives here
// ===========================================================================
var TUNING = {
  gravity: 1800,              // px/s^2, normal fall acceleration
  diveGravityMult: 4,         // multiplier applied to gravity while diving
  diveForwardAccel: 260,      // px/s^2, small forward push while diving
  diveMaxAngle: 0.96,         // rad (~55 deg), hard cap on how nose-down an airborne dive can
                              // pitch -- diveGravityMult alone saturates vy almost immediately
                              // while vx creeps up slowly, so uncapped this read as a near-vertical
                              // nosedive instead of a fast dive

  // Reference implementations (haqu/tiny-wings, ncase/Pony-Wings) apply the
  // dive force continuously whether the player is grounded or airborne --
  // holding dive on a downslope actively pumps extra speed, and holding it
  // on an upslope pushes you forward through the climb. Without this the
  // only speed source is passive gravity-along-slope, which (being
  // energy-conserving over a symmetric hill) never really builds momentum.
  groundPump: {
    flatEpsilon: 0.02,        // slope below this counts as "climbing", not "descending"
    descendMult: 3.2,         // extra multiple of gravity pumped in while diving downhill
    ascendForwardAccel: 2000  // px/s^2 forward push while diving up a slope
  },

  minSpeed: 180,              // px/s, player is never allowed to fully stall
  maxSpeed: 2500,             // px/s, overall speed clamp
  maxFallSpeed: 3000,         // px/s, vertical fall speed clamp
  minForwardVel: 90,          // px/s, floor on vx so the player never goes backward

  // Hidden left-side touch zone: holding it while airborne rotates the
  // velocity vector (nose up) at this rate, speed-preserving, so a bad
  // launch angle can be corrected into a better landing. Floored so
  // holding it can't rotate all the way into flying backward.
  // maxContinuous/cooldown exist because gravity keeps adding fresh energy
  // to vy every frame regardless -- rotating that back upward on an
  // uncapped loop let a held tilt inject speed indefinitely and effectively
  // fly forever instead of just correcting one landing. A budget per hold
  // plus a forced pause once it's spent closes that off; both reset on
  // landing, so it's a per-flight limit, not a permanent one.
  airTilt: { rate: 2.4, minAngle: -0.9, maxContinuous: 0.6, cooldown: 1.3 },

  // Hidden left-side touch zone while grounded: purely cosmetic, no
  // speed/physics change -- just a wheelie pose so the split still reads
  // as "doing something" without altering the ride.
  wheelie: { tiltAngle: 0.35 },

  // Apple pickup: a big vertical launch plus a forced backflip. The flip
  // is purely a visual overlay on top of the normal velocity-driven angle
  // (see drawPlayer) -- it never touches the real landing-angle physics,
  // so a badly-timed flip can't itself cause a bail.
  // Pitches the CURRENT velocity vector up by a bounded amount and gives
  // it a speed multiplier, rather than overriding vy to a big absolute
  // value (the original version set vy=-1550 outright with only a weak
  // floor on vx -- a near-vertical launch with ~1.5-2s of hang time, far
  // longer than any normal jump, during which Phil drifted hundreds of
  // extra world px forward and often landed on unrelated -- sometimes
  // uphill-facing -- terrain a fixed steep descent angle couldn't match.
  // Measured a 100% bail rate from that). Rotating from whatever angle
  // Phil is ALREADY moving at (rather than snapping to one fixed angle)
  // keeps the launch correlated with the terrain he just took off from,
  // the same way a normal jump's angle is -- it's a bigger version of his
  // current jump, not an unrelated one.
  apple: { pitchUp: 0.65, speedMult: 1.35, backflipDuration: 0.6 },

  camera: {
    leadFraction: 0.30,       // player sits 30% of the way across the screen
    easeX: 8.0,               // horizontal follow ease rate (keeps up with speed)
    easeY: 3.5,               // vertical follow ease rate while grounded (soft/floaty)
    easeYAirborne: 9.0,       // snappier vertical ease in the air so the lookahead below
                              // actually catches up before a (typically brief) flight ends
    zoomMin: 0.22,            // zoomed out at top speed/fall rate/altitude
    zoomMax: 1.0,             // zoomed in at low speed
    zoomSpeedRef: 1500,       // px/s speed at which zoom reaches zoomMin
    zoomAltRef: 500,          // px of altitude above terrain at which zoom reaches zoomMin
    zoomAirborneMin: 0.45,    // floor on the zoom-out ratio any time we're in the air at all
    easeZoom: 1.6,            // slow, soft transition -- gradual rather than snappy
    vertLookaheadTime: 0.3,   // s, how far ahead of a climb/fall the camera peeks
    vertLookaheadMax: 320     // px, cap on that vertical peek-ahead offset
  },

  terrain: {
    baseline: 0,              // world Y of the "flat" reference line
    minWidth: 420,            // narrowest hill half-span-ish segment width (roomy relative to Phil's sprite)
    maxWidth: 460,            // widest segment width at max difficulty
    minAmp: 215,              // smallest hill amplitude (roomy relative to Phil's sprite)
    maxAmp: 240               // largest hill amplitude at max difficulty
  },

  difficulty: {
    rampDistance: 96000       // world px over which difficulty ramps to max
  },

  // The finite journey: three named legs back to back. Reaching the end of
  // the last one (the house at the end of Sunderland) is the win condition.
  // rampDistance above spans the whole trip, so terrain gets toughest right
  // as you approach home.
  journey: {
    sections: [
      { name: "GATESHEAD", length: 32000 },
      { name: "WASHINGTON", length: 32000 },
      { name: "SUNDERLAND", length: 32000 }
    ]
  },

  mission: {
    timeLimit: 360            // s, must reach home before this runs out
  },

  // The finish: Phil doesn't just cross a line, he glides in and rides
  // straight through the front door of the house waiting at the end of
  // Sunderland, disappearing inside -- then, after a beat, pops up
  // celebrating in the upstairs window before the WIN screen appears.
  finish: {
    decelDistance: 1400,      // px before the house where the scripted glide begins
    doorOffset: 34,           // px before the house's center where the doorway sits -- Phil
                              // rides through here and disappears, rather than stopping short
    decelRate: 1400,          // px/s^2 braking rate during the glide
    minEntrySpeed: 90,        // px/s floor kept during the glide so he visibly rides IN through
                              // the door instead of crawling to a stop just before it
    hiddenDuration: 0.7,      // s spent out of sight after riding through the door
    celebrateDuration: 2.5,   // s hang time celebrating in the window before WIN
    confettiCount: 36,
    flatZoneLength: 2000      // px of guaranteed level ground before the house (comfortably longer
                               // than any single hill's max width so the flat run never gets clipped)
  },

  landing: {
    perfectAngleThreshold: 32 * Math.PI / 180, // ~32 degrees -- forgiving enough that a landing near a
                                                // hilltop crest (where the curve's slope eases toward
                                                // zero by construction) still reads as smooth
    perfectSpeedBonus: 1.05,  // keep 100%+ speed on a perfect slide
    penaltyStrength: 0.85,    // how hard bad landings bleed speed (softer than before)
    minPenaltyFactor: 0.55,   // worst-case fraction of speed kept on a slam (higher floor, less choppy)
    bailAngleThreshold: 100 * Math.PI / 180, // beyond this mismatch it's a full bail, not just a rough landing
    bailDuration: 0.7,        // s, tumbling before regaining control
    bailSpeedFactor: 0.3,     // fraction of impact speed kept through a bail
    bailSpinSpeed: 18,        // rad/s, visual tumble spin while bailing
    bailShakeMag: 10,         // px, camera shake amplitude on a bail
    bailShakeDuration: 0.35   // s, camera shake duration on a bail
  },

  combo: {
    step: 0.15,               // score multiplier gained per combo step
    max: 10
  },

  airtime: {
    startDelay: 0.5,          // s of continuous airtime before the counter/ticking kicks in at all --
                              // skips the noise of every little hop and only rewards real airtime
    tickInterval: 0.1,        // s between ticks once past startDelay -- fast, ascending feel
    scorePerTick: 1,          // pending score banked per tick, resolved on landing (not added immediately)
    pulseDuration: 0.16,      // s, how long the HUD score "punch" animation lasts per tick
    resolveDuration: 1.0,     // s, how long the landing resolution (doubled/crossed-out/banked) stays on screen
    tickPitchStart: 520,      // Hz, tone frequency for the first tick of a flight
    tickPitchStep: 22,        // Hz added per successive tick, capped at tickPitchMax
    tickPitchMax: 1300
  },

  // Battery: the bike's real fuel gauge. Draining only happens while dive
  // is actively held (that's the "press" the pump mechanic runs on) --
  // coasting costs nothing. Only battery pickups refill it; running dry
  // is a fail condition, same as the old sunset-timer's role.
  battery: {
    max: 100,
    drainRate: 6,             // bar units drained per second while dive is held
    refillPickup: 40,         // refill granted only once the whole row below is collected
    rechargeRate: 90,         // bar units/sec the meter animates up at once a row completes
    rowSize: 4,               // batteries per row -- only the row's leader is visible/collectible
                              // at a time; collecting it reveals the next one
    rowSpacing: 90            // world px between consecutive batteries along the hill contour
  },

  pickups: {
    magnetRadius: 100,
    magnetPull: 6.0,
    collectRadius: 26,
    spawnChancePerHill: 0.65,
    arcHeight: 150,
    coinScore: 10,
    boostScore: 5,
    boostAmount: 480,
    weights: { coin: 66, boost: 18, battery: 8 }, // battery halved (50% rarer) -- refills matter more when scarce

    // Apple: a rare, separate "reach for it" pickup that lives above a
    // peak -- rolled independently of the normal spawn gate above, since it
    // occupies its own airspace and shouldn't compete with (or get crowded
    // out by) the regular coin/boost/battery spawn on the same hill.
    //
    // Playtested with Playwright by measuring real jump arcs off a wide
    // range of generated peaks (varying preceding-climb strength, since
    // that -- not raw skill -- is most of what determines how high a given
    // launch can go): a target this high up needs a strong climb behind it
    // and is only reachable off maybe half of qualifying peaks; anything
    // higher missed by 200-600px on the weaker ones far more often than it
    // connected. This height/distance is low enough that it's reachable
    // off essentially any qualifying peak with a decent (not perfect)
    // climb, and a wide magnet radius forgives the rest of the aim.
    appleChance: 0.16,        // per qualifying peak
    appleApexHeight: 120,     // world px above the peak, at the apex
    appleApexDx: 160,         // world px past the peak, at the apex
    appleMagnetRadius: 220,   // wide -- this is a precision mid-air grab, be forgiving
    appleMagnetPull: 16.0,    // much stronger than the standard pull -- proportional-to-gap
                              // servoing at the normal 6.0 rate isn't enough to close on a
                              // fast-moving player passing at an angle; measured cases sitting
                              // in range for 100+ frames without ever converging otherwise
    appleCollectRadius: 46,
    appleScore: 25
  },

  // motion streaks trailing the player -- purely cosmetic, scales the
  // "sense of speed" with how fast you're actually going
  speedFx: {
    threshold: 700,        // px/s below this, no streaks at all
    maxRef: 2200,          // px/s at which streak intensity/size maxes out
    spawnChance: 0.9,      // per-tick spawn chance at full intensity
    lifeTime: 0.22,        // s
    minLen: 40, maxLen: 170
  },

  fixedDt: 1 / 120
};

// Journey helpers -- section boundaries derived from TUNING.journey.sections
// so there's one source of truth for where each named leg starts/ends.
var JOURNEY_TOTAL_DISTANCE = (function () {
  var total = 0;
  for (var i = 0; i < TUNING.journey.sections.length; i++) total += TUNING.journey.sections[i].length;
  return total;
})();
function sectionIndexAtDistance(x) {
  var acc = 0;
  var sections = TUNING.journey.sections;
  for (var i = 0; i < sections.length; i++) {
    acc += sections[i].length;
    if (x < acc) return i;
  }
  return sections.length - 1;
}
function sectionStartDistance(index) {
  var acc = 0;
  for (var i = 0; i < index; i++) acc += TUNING.journey.sections[i].length;
  return acc;
}

var philGameoverImg = (function () { var img = new Image(); img.src = PHIL_GAMEOVER_SRC; return img; })();

var ASSETS = {
  player: {
    sheet: (function () { var img = new Image(); img.src = PHIL_SPRITE_SRC; return img; })(),
    sheetCols: 3,
    sheetRows: 2,
    frames: null, // populated once from the sheet: 6 isolated per-frame canvases
    rollCycle: [0, 1, 2, 3], // indices into `frames`, in pedal-cycle order
    airCoastFrame: 4,
    airDiveFrame: 5,
    displaySize: 58, // on-screen width/height in world px at zoom 1
    rollCyclesPerSecondAtRef: 3, // pedal cycle rate at rollSpeedRef
    rollSpeedRef: 900, // px/s

    // Where the wheels touch ground, as a fraction of the frame (measured
    // from the art: consistent across all 6 poses at x~0.48-0.53,
    // y~0.985-0.997 -- i.e. almost the bottom edge). Physics tracks a
    // single ground-contact point and rotates the sprite around it; drawing
    // centered on that point (the old 0.5/0.5 default) put the pivot at the
    // torso instead of the wheels, so the wheels swung off the terrain
    // curve as slope changed instead of staying planted on it -- that
    // mismatch, exaggerated by the sprite being much bigger than the old
    // placeholder circle, is what read as "choppy" motion.
    anchorX: 0.5,
    anchorY: 0.97,

    // Slicing frames straight out of the sheet with drawImage every render
    // let the browser's smoothing sample a sliver of the *next* frame at
    // each cell boundary (visible as thin seam lines, worst near the head
    // where art sits close to the top edge) -- and turning smoothing off to
    // avoid that made rotation look jagged/choppy instead. Extracting each
    // frame into its own canvas once removes the neighboring pixels
    // entirely, so smoothing can stay on for clean rotation with no bleed.
    _buildFrames: function () {
      var img = this.sheet;
      var fw = img.naturalWidth / this.sheetCols;
      var fh = img.naturalHeight / this.sheetRows;
      var frames = [];
      for (var r = 0; r < this.sheetRows; r++) {
        for (var c = 0; c < this.sheetCols; c++) {
          var cv = document.createElement("canvas");
          cv.width = fw;
          cv.height = fh;
          var cctx = cv.getContext("2d");
          cctx.imageSmoothingEnabled = false; // exact 1:1 pixel copy
          cctx.drawImage(img, c * fw, r * fh, fw, fh, 0, 0, fw, fh);
          frames.push(cv);
        }
      }
      this.frames = frames;
    },

    draw: function (ctx, x, y, angle, state, speed) {
      if (!this.frames) {
        if (this.sheet.complete && this.sheet.naturalWidth > 0) {
          this._buildFrames();
        } else {
          // brief fallback while the embedded data-URI image decodes
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(angle);
          ctx.fillStyle = "#3b3b3b";
          ctx.beginPath();
          ctx.arc(0, 0, 16, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          return;
        }
      }

      var idx;
      if (state === "BAIL") {
        idx = this.airCoastFrame; // any single frame reads as a tumble once spun
      } else if (state === "AIRBORNE_DIVE") {
        idx = this.airDiveFrame;
      } else if (state === "AIRBORNE") {
        idx = this.airCoastFrame;
      } else {
        var cyclesPerSecond = this.rollCyclesPerSecondAtRef * (speed / this.rollSpeedRef);
        var phase = (performance.now() / 1000) * cyclesPerSecond;

      }

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.imageSmoothingEnabled = true; // safe now -- the source frame has no neighbors to bleed in
      var ox = -this.displaySize * this.anchorX;
      var oy = -this.displaySize * this.anchorY;

      ctx.restore();
    }
  },

  terrain: {
    // One themed fill/stripe/outline pair per journey section (see
    // TUNING.journey.sections) -- terrain color identifies which leg of
    // the trip you're on: Gateshead brown, Washington orange, Sunderland green.
    sectionPalettes: [
      { fill: "#a9754a", stripe: "#8f6238", outline: "#5c3f22" }, // Gateshead -- brown
      { fill: "#e0913f", stripe: "#c67931", outline: "#8a4f1a" }, // Washington -- orange
      { fill: "#7ec850", stripe: "#6ab63f", outline: "#3e7a28" }  // Sunderland -- green
    ]
  },

  // The finish-line landmark: a cosy cottage waiting at the end of
  // Sunderland. Drawn at a fixed screen size (matching the player/pickups
  // convention) anchored to its world-space ground contact point.
  house: {
    wall: "#e8c78a",
    wallShade: "#c9a468",
    roof: "#8a3b2b",
    roofShade: "#6d2c20",
    door: "#5c3a21",
    window: "#bfe8ff",
    windowFrame: "#5c3a21",
    chimney: "#8a7566",
    smoke: "rgba(255,255,255,0.55)",
    width: 150,
    height: 120,
    draw: function (ctx, x, groundY, t) {
      var w = this.width, h = this.height;
      ctx.save();
      ctx.translate(x, groundY);

      // walls
      ctx.fillStyle = this.wall;
      ctx.fillRect(-w / 2, -h, w, h);
      ctx.fillStyle = this.wallShade;
      ctx.fillRect(-w / 2, -h, w * 0.16, h);

      // roof
      ctx.fillStyle = this.roof;
      ctx.beginPath();
      ctx.moveTo(-w / 2 - 18, -h);
      ctx.lineTo(0, -h - 74);
      ctx.lineTo(w / 2 + 18, -h);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = this.roofShade;
      ctx.beginPath();
      ctx.moveTo(0, -h - 74);
      ctx.lineTo(w / 2 + 18, -h);
      ctx.lineTo(w / 2 - 8, -h);
      ctx.closePath();
      ctx.fill();

      // chimney + drifting smoke
      ctx.fillStyle = this.chimney;
      ctx.fillRect(w * 0.2, -h - 58, 18, 42);
      ctx.fillStyle = this.smoke;
      for (var i = 0; i < 3; i++) {
        var puffT = (t * 0.4 + i / 3) % 1;
        var puffX = w * 0.2 + 9 + Math.sin((t + i) * 2) * 6;
        var puffY = -h - 62 - puffT * 55;
        ctx.globalAlpha = (1 - puffT) * 0.55;
        ctx.beginPath();
        ctx.arc(puffX, puffY, 8 + puffT * 10, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // window
      ctx.fillStyle = this.windowFrame;
      ctx.fillRect(w * 0.08, -h + 20, 46, 38);
      ctx.fillStyle = this.window;
      ctx.fillRect(w * 0.08 + 4, -h + 24, 38, 30);

      // door
      ctx.fillStyle = this.door;
      ctx.fillRect(-w / 2 + 22, -44, 38, 44);

      ctx.restore();
    }
  },

  sky: { top: "#8fd3ff", bottom: "#fff3c4" },

  pickups: {

      color: "#ffd347", ring: "#c98f00", glow: "#fff4b0",

        var spin = Math.abs(Math.cos(t * 3.4));
        var rx = Math.max(3, 14 * scale * spin), ry = 14 * scale;

        ctx.save();
        ctx.shadowColor = ASSETS.pickups.coin.glow;
        ctx.shadowBlur = 8 + 8 * spin;
        ctx.fillStyle = ASSETS.pickups.coin.color;
        ctx.strokeStyle = ASSETS.pickups.coin.ring;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.globalAlpha = 1 - spin;
        ctx.fillStyle = ASSETS.pickups.coin.glow;

    boost: {

        ctx.save();
        ctx.shadowColor = ASSETS.pickups.boost.glow;
        ctx.shadowBlur = 10 + 8 * spin;
        ctx.fillStyle = ASSETS.pickups.boost.color;
        ctx.strokeStyle = ASSETS.pickups.boost.ring;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);
        ctx.shadowColor = ASSETS.pickups.battery.glow;
        ctx.shadowBlur = 10 + 6 * pulse;
        ctx.fillStyle = ASSETS.pickups.battery.color;

    apple: {
      color: "#e6432f", colorDark: "#a91f14", highlight: "#ff9a86",
      stem: "#7a4b25", leaf: "#63c250", glow: "#ffcf7a",
      draw: function (ctx, x, y, t, scale) {

        var a = ASSETS.pickups.apple;
        var bob = Math.sin(t * 2.4) * 6 * scale;

        // close enough to see what it is
        ctx.save();
        ctx.globalAlpha = 0.22 + 0.16 * pulse;
        ctx.strokeStyle = a.glow;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(cx, cy, 22 * scale + 7 * pulse, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        drawPickupSparkle(ctx, cx, cy, t, 28 * scale, a.glow);

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(rock);
        ctx.scale(scale, scale);
        ctx.shadowColor = a.glow;
        ctx.shadowBlur = 14 + 8 * pulse;

        var r = 13;
        // body -- two overlapping lobes read as a proper apple silhouette
        // instead of a plain circle
        ctx.fillStyle = a.color;
        ctx.beginPath();
        ctx.ellipse(-r * 0.42, r * 0.08, r * 0.72, r * 0.92, 0, 0, Math.PI * 2);
        ctx.ellipse(r * 0.42, r * 0.08, r * 0.72, r * 0.92, 0, 0, Math.PI * 2);
        ctx.fill();

        // soft shading, lower-right, as if lit from the upper-left
        ctx.globalAlpha = 0.32;
        ctx.fillStyle = a.colorDark;
        ctx.beginPath();
        ctx.ellipse(r * 0.32, r * 0.32, r * 0.62, r * 0.78, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        // glossy highlight
        ctx.fillStyle = a.highlight;
        ctx.beginPath();
        ctx.ellipse(-r * 0.5, -r * 0.38, r * 0.26, r * 0.4, -0.4, 0, Math.PI * 2);
        ctx.fill();

        // stem, curling slightly
        ctx.strokeStyle = a.stem;
        ctx.lineWidth = 2.2;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.8);
        ctx.quadraticCurveTo(r * 0.2, -r * 1.2, r * 0.05, -r * 1.5);
        ctx.stroke();

        // leaf
        ctx.fillStyle = a.leaf;
        ctx.beginPath();
        ctx.ellipse(r * 0.38, -r * 1.18, r * 0.44, r * 0.22, -0.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }
  },

  speedStreak: { color: "255,255,255" }, // RGB triplet, alpha applied per-streak by fade

  sounds: { perfect: null, land: null, pickup: null }, // stub hooks, no audio yet

  // Retro synthwave movie-poster look for the title/menu screen: sunset
  // gradient sky, a striped sun on the horizon, a receding grid, and a
  // chrome/neon gradient title with a pulsing start button.
  title: {
    skyTop: "#1b0a3d",
    skyMid: "#7c2565",
    skyLow: "#ff7a45",
    sunTop: "#ffe66d",
    sunBottom: "#ff3d68",
    rayColor: "rgba(255,220,150,0.10)",
    groundColor: "#170826",
    gridColor: "rgba(255,110,190,0.55)",
    titleGradTop: "#eafcff",
    titleGradBottom: "#6fd8ff",
    titleStroke: "#ff3da6",
    tagline: "#ffe66d",
    routeColor: "rgba(255,255,255,0.85)",
    buttonBg: "#ff3da6",
    buttonBgAlt: "#ffb84d",
    buttonText: "#1a0033",
    hintColor: "rgba(255,255,255,0.75)"
  },

  hud: {
    text: "#ffffff",
    shadow: "rgba(0,0,0,0.4)",
    panelBg: "rgba(20,10,40,0.42)",
    panelBorder: "rgba(255,255,255,0.16)",
    speedColor: "rgba(255,255,255,0.8)",
    batteryBarBg: "rgba(0,0,0,0.3)",
    batteryBarFill: "#7ee8ff",
    batteryBarFillAlt: "#ff3da6",
    batteryBarLow: "#ff5d5d",
    comboColor: "#ffb84d",
    perfectColor: "#ffffff",
    bailColor: "#ff3030",
    airtimeColor: "#c9a6ff",
    doubleColor: "#ffe66d",
    titleColor: "#ffffff",
