<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Downhill Phil</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
  canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function () {
"use strict";

var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");
var W = 0, H = 0, DPR = 1;

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);

// ---------------------------------------------------------------------------
// small helpers
// ---------------------------------------------------------------------------
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function randRange(a, b) { return a + Math.random() * (b - a); }
function normalizeAngle(a) {
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}
// frame-rate independent exponential ease: moves `current` toward `target`
function easeTowards(current, target, rate, dt) {
  var t = 1 - Math.exp(-rate * dt);
  return current + (target - current) * t;
}

// ===========================================================================
// 1. TUNING — every physics/feel constant lives here
// ===========================================================================
var TUNING = {
  gravity: 1800,              // px/s^2, normal fall acceleration
  diveGravityMult: 4,         // multiplier applied to gravity while diving
  diveForwardAccel: 260,      // px/s^2, small forward push while diving

  // Reference implementations (haqu/tiny-wings, ncase/Pony-Wings) apply the
  // dive force continuously whether the player is grounded or airborne --
  // holding dive on a downslope actively pumps extra speed, and holding it
  // on an upslope pushes you forward through the climb. Without this the
  // only speed source is passive gravity-along-slope, which (being
  // energy-conserving over a symmetric hill) never really builds momentum.
  groundPump: {
    flatEpsilon: 0.02,        // slope below this counts as "climbing", not "descending"
    descendMult: 3.2,         // extra multiple of gravity pumped in while diving downhill
    ascendForwardAccel: 2000  // px/s^2 forward push while diving up a slope
  },

  minSpeed: 180,              // px/s, player is never allowed to fully stall
  maxSpeed: 2500,             // px/s, overall speed clamp
  maxFallSpeed: 3000,         // px/s, vertical fall speed clamp
  minForwardVel: 90,          // px/s, floor on vx so the player never goes backward

  camera: {
    leadFraction: 0.30,       // player sits 30% of the way across the screen
    easeX: 8.0,               // horizontal follow ease rate (keeps up with speed)
    easeY: 3.5,               // vertical follow ease rate while grounded (soft/floaty)
    easeYAirborne: 9.0,       // snappier vertical ease in the air so the lookahead below
                              // actually catches up before a (typically brief) flight ends
    zoomMin: 0.22,            // zoomed out at top speed/fall rate/altitude
    zoomMax: 1.0,             // zoomed in at low speed
    zoomSpeedRef: 1500,       // px/s speed at which zoom reaches zoomMin
    zoomAltRef: 500,          // px of altitude above terrain at which zoom reaches zoomMin
    zoomAirborneMin: 0.45,    // floor on the zoom-out ratio any time we're in the air at all
    easeZoom: 1.6,            // slow, soft transition -- gradual rather than snappy
    vertLookaheadTime: 0.3,   // s, how far ahead of a climb/fall the camera peeks
    vertLookaheadMax: 320     // px, cap on that vertical peek-ahead offset
  },

  terrain: {
    baseline: 0,              // world Y of the "flat" reference line
    minWidth: 420,            // narrowest hill half-span-ish segment width (roomy relative to Phil's sprite)
    maxWidth: 460,            // widest segment width at max difficulty
    minAmp: 215,              // smallest hill amplitude (roomy relative to Phil's sprite)
    maxAmp: 240,              // largest hill amplitude at max difficulty
    hillsPerIsland: 6,        // every N hills = new island color palette
    pixelBlockSize: 8         // world px per stair-step block (crisp pixel-art terrain)
  },

  difficulty: {
    rampDistance: 24000       // world px over which difficulty ramps to max
  },

  // The finite journey: three named legs back to back. Reaching the end of
  // the last one is the win condition. rampDistance above spans the whole
  // trip, so terrain gets toughest right as you approach home.
  journey: {
    sections: [
      { name: "GATESHEAD", length: 8000 },
      { name: "WASHINGTON", length: 8000 },
      { name: "HOME", length: 8000 }
    ]
  },

  mission: {
    timeLimit: 90             // s, must reach home before this runs out
  },

  landing: {
    perfectAngleThreshold: 20 * Math.PI / 180, // ~20 degrees
    perfectSpeedBonus: 1.05,  // keep 100%+ speed on a perfect slide
    penaltyStrength: 1.3,     // how hard bad landings bleed speed
    minPenaltyFactor: 0.35,   // worst-case fraction of speed kept on a slam
    bailAngleThreshold: 100 * Math.PI / 180, // beyond this mismatch it's a full bail, not just a rough landing
    bailDuration: 0.7,        // s, tumbling before regaining control
    bailSpeedFactor: 0.3,     // fraction of impact speed kept through a bail
    bailSpinSpeed: 18,        // rad/s, visual tumble spin while bailing
    bailShakeMag: 10,         // px, camera shake amplitude on a bail
    bailShakeDuration: 0.35   // s, camera shake duration on a bail
  },

  combo: {
    step: 0.15,               // score multiplier gained per combo step
    max: 10
  },

  // Battery: the bike's real fuel gauge. Draining only happens while dive
  // is actively held (that's the "press" the pump mechanic runs on) --
  // coasting costs nothing. Only battery pickups refill it; running dry
  // is a fail condition, same as the old sunset-timer's role.
  battery: {
    max: 100,
    drainRate: 6,             // bar units drained per second while dive is held
    refillPickup: 40          // refill from a battery pickup
  },

  pickups: {
    magnetRadius: 100,
    magnetPull: 6.0,
    collectRadius: 26,
    spawnChancePerHill: 0.65,
    arcHeight: 150,
    coinScore: 10,
    boostScore: 5,
    boostAmount: 480,
    weights: { coin: 66, boost: 18, battery: 16 }
  },

  // motion streaks trailing the player -- purely cosmetic, scales the
  // "sense of speed" with how fast you're actually going
  speedFx: {
    threshold: 700,        // px/s below this, no streaks at all
    maxRef: 2200,          // px/s at which streak intensity/size maxes out
    spawnChance: 0.9,      // per-tick spawn chance at full intensity
    lifeTime: 0.22,        // s
    minLen: 40, maxLen: 170
  },

  fixedDt: 1 / 120
};

// Journey helpers -- section boundaries derived from TUNING.journey.sections
// so there's one source of truth for where each named leg starts/ends.
var JOURNEY_TOTAL_DISTANCE = (function () {
  var total = 0;
  for (var i = 0; i < TUNING.journey.sections.length; i++) total += TUNING.journey.sections[i].length;
  return total;
})();
function sectionIndexAtDistance(x) {
  var acc = 0;
  var sections = TUNING.journey.sections;
  for (var i = 0; i < sections.length; i++) {
    acc += sections[i].length;
    if (x < acc) return i;
  }
  return sections.length - 1;
}
function sectionStartDistance(index) {
  var acc = 0;
  for (var i = 0; i < index; i++) acc += TUNING.journey.sections[i].length;
  return acc;
}

var ASSETS = {
  player: {
    sheet: (function () { var img = new Image(); img.src = PHIL_SPRITE_SRC; return img; })(),
    sheetCols: 3,
    sheetRows: 2,
    frames: null, // populated once from the sheet: 6 isolated per-frame canvases
    rollCycle: [0, 1, 2, 3], // indices into `frames`, in pedal-cycle order
    airCoastFrame: 4,
    airDiveFrame: 5,
    displaySize: 58, // on-screen width/height in world px at zoom 1
    rollCyclesPerSecondAtRef: 3, // pedal cycle rate at rollSpeedRef
    rollSpeedRef: 900, // px/s

    // Where the wheels touch ground, as a fraction of the frame (measured
    // from the art: consistent across all 6 poses at x~0.48-0.53,
    // y~0.985-0.997 -- i.e. almost the bottom edge). Physics tracks a
    // single ground-contact point and rotates the sprite around it; drawing
    // centered on that point (the old 0.5/0.5 default) put the pivot at the
    // torso instead of the wheels, so the wheels swung off the terrain
    // curve as slope changed instead of staying planted on it -- that
    // mismatch, exaggerated by the sprite being much bigger than the old
    // placeholder circle, is what read as "choppy" motion.
    anchorX: 0.5,
    anchorY: 0.97,

    // Slicing frames straight out of the sheet with drawImage every render
    // let the browser's smoothing sample a sliver of the *next* frame at
    // each cell boundary (visible as thin seam lines, worst near the head
    // where art sits close to the top edge) -- and turning smoothing off to
    // avoid that made rotation look jagged/choppy instead. Extracting each
    // frame into its own canvas once removes the neighboring pixels
    // entirely, so smoothing can stay on for clean rotation with no bleed.
    _buildFrames: function () {
      var img = this.sheet;
      var fw = img.naturalWidth / this.sheetCols;
      var fh = img.naturalHeight / this.sheetRows;
      var frames = [];
      for (var r = 0; r < this.sheetRows; r++) {
        for (var c = 0; c < this.sheetCols; c++) {
          var cv = document.createElement("canvas");
          cv.width = fw;
          cv.height = fh;
          var cctx = cv.getContext("2d");
          cctx.imageSmoothingEnabled = false; // exact 1:1 pixel copy
          cctx.drawImage(img, c * fw, r * fh, fw, fh, 0, 0, fw, fh);
          frames.push(cv);
        }
      }
      this.frames = frames;
    },

        var cyclesPerSecond = this.rollCyclesPerSecondAtRef * (speed / this.rollSpeedRef);
        var phase = (performance.now() / 1000) * cyclesPerSecond;
        idx = this.rollCycle[Math.floor(phase % this.rollCycle.length)];
      }

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.imageSmoothingEnabled = true; // safe now -- the source frame has no neighbors to bleed in
      var ox = -this.displaySize * this.anchorX;
      var oy = -this.displaySize * this.anchorY;
      ctx.drawImage(this.frames[idx], ox, oy, this.displaySize, this.displaySize);
      ctx.restore();
    }
  },

  terrain: {
    outline: "#3e7a28",
    // cycles by island index; each entry is one hill-fill / stripe pair
    islands: [
      { fill: "#7ec850", stripe: "#6ab63f" },
      { fill: "#59b7c4", stripe: "#3f9aa8" },
      { fill: "#d9a441", stripe: "#c08a2b" },
      { fill: "#8d7fd6", stripe: "#7266bd" }
    ]
  },

  sky: { top: "#8fd3ff", bottom: "#fff3c4" },

  // Drawn in pure screen space (see drawBackgroundHills) -- deliberately NOT
  // tied to world Y or camera zoom, just like a painted-far-away backdrop:
  // only a slow horizontal drift, so zoom/altitude swings during a dive
  // never make this layer swell, shrink, or jump around.
  backgroundHills: [
    { fill: "#cdeed6", parallax: 0.025, wavelength: 900, amp: 22, baseYFrac: 0.5 },
    { fill: "#aee0bd", parallax: 0.05, wavelength: 620, amp: 30, baseYFrac: 0.56 }
  ],

  clouds: {
    fill: "rgba(255,255,255,0.9)",
    draw: function (ctx, x, y, scale) {

      ctx.translate(x, y);
      ctx.scale(scale, scale);

      ctx.ellipse(26, 6, 24, 14, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  },

  pickups: {
    coin: {
      color: "#ffd347", ring: "#c98f00",
      draw: function (ctx, x, y, t) {
        var bob = Math.sin(t * 4) * 4;
        ctx.save();
        ctx.translate(x, y + bob);
        ctx.fillStyle = ASSETS.pickups.coin.color;
        ctx.strokeStyle = ASSETS.pickups.coin.ring;
        ctx.lineWidth = 3;

        ctx.fill();
        ctx.stroke();

    },
    boost: {
      color: "#ff8a3d", ring: "#b5350a",
      draw: function (ctx, x, y, t) {
        var bob = Math.sin(t * 5) * 4;
        ctx.save();
        ctx.translate(x, y + bob);
        ctx.fillStyle = ASSETS.pickups.boost.color;
        ctx.strokeStyle = ASSETS.pickups.boost.ring;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
    },
    battery: {
      color: "#7ee8ff", ring: "#1a8fae", bolt: "#ffffff",
      draw: function (ctx, x, y, t) {

    shadow: "rgba(0,0,0,0.35)",
    batteryBarBg: "rgba(0,0,0,0.28)",
    batteryBarFill: "#7ee8ff",
    batteryBarLow: "#ff5d5d",
    comboColor: "#ff5d5d",
    perfectColor: "#ffffff",
    bailColor: "#ff3030",
    titleColor: "#ffffff",
    sectionColor: "#ffffff",
    timeLowColor: "#ff5d5d"
  }

// ===========================================================================
// 3. Terrain — cosine-interpolated hills, endless generation, culling
// ===========================================================================
var terrain = {
  keyPoints: [],
  generatedUntilX: 0,
  hillCount: 0,
  islandIndex: 0,
  lastDir: -1,

  init: function () {
    this.keyPoints = [
      { x: -400, y: TUNING.terrain.baseline, hillIndex: 0, islandIndex: 0 },
      { x: 0, y: TUNING.terrain.baseline, hillIndex: 0, islandIndex: 0 }
    ];
    this.generatedUntilX = 0;
    this.hillCount = 0;
    this.islandIndex = 0;
    this.lastDir = -1;
  },

  ensureGenerated: function (targetX) {
    targetX = Math.min(targetX, JOURNEY_TOTAL_DISTANCE);
    while (this.generatedUntilX < targetX) {
      var last = this.keyPoints[this.keyPoints.length - 1];
      var t = TUNING.terrain;
      var diff = clamp(Math.max(0, last.x) / TUNING.difficulty.rampDistance, 0, 1);

      var width = lerp(t.minWidth, t.maxWidth, diff) * randRange(0.75, 1.25);
      var amp = lerp(t.minAmp, t.maxAmp, diff) * randRange(0.55, 1.0);

      // Strictly alternate up/down every hill -- matching haqu/tiny-wings'
      // terrain generator (`sign *= -1` each key point) -- so every key
      // point is a real peak or trough of the scalloped chain.
      var dir = -this.lastDir;
      this.lastDir = dir;

      var newY = clamp(
        t.baseline + dir * amp,
        t.baseline - t.maxAmp * 1.4,
        t.baseline + t.maxAmp * 1.4
      );
      var newX = last.x + width;

      this.hillCount++;
      if (this.hillCount % t.hillsPerIsland === 0) this.islandIndex++;

      var newPoint = { x: newX, y: newY, hillIndex: this.hillCount, islandIndex: this.islandIndex };
      this.keyPoints.push(newPoint);
      this.generatedUntilX = newX;

      pickups.trySpawnForHill(last, newPoint);
    }
  },

  cull: function (beforeX) {
    while (this.keyPoints.length > 4 && this.keyPoints[1].x < beforeX) {
      this.keyPoints.shift();
    }
  },

  // find index i such that keyPoints[i].x <= x < keyPoints[i+1].x
  segmentIndexAt: function (x) {
    var kp = this.keyPoints;
    var lo = 0, hi = kp.length - 2;
    if (x <= kp[0].x) return 0;
    if (x >= kp[kp.length - 1].x) return kp.length - 2;
    while (lo < hi) {
      var mid = (lo + hi + 1) >> 1;
      if (kp[mid].x <= x) lo = mid; else hi = mid - 1;
    }
    return lo;
  },

  y: function (x) {
    var kp = this.keyPoints;
    var i = this.segmentIndexAt(x);
    var a = kp[i], b = kp[i + 1];
    if (!b) return a.y;
    var span = b.x - a.x;
    var t = span > 0 ? clamp((x - a.x) / span, 0, 1) : 0;
    var mu2 = (1 - Math.cos(t * Math.PI)) / 2;
    return a.y * (1 - mu2) + b.y * mu2;
  },

  slope: function (x) {
    var eps = 4;
    return (this.y(x + eps) - this.y(x - eps)) / (2 * eps);
  }
};

// ===========================================================================
// 4. Player — grounded/airborne state machine, landing logic, combo
// ===========================================================================
var player = {
  x: 0, y: 0, vx: 0, vy: 0, speed: 0,
  angle: 0,
  state: "GROUNDED", // GROUNDED | AIRBORNE
  diveHeld: false,
  combo: 0,
  distance: 0,
  bailTimer: 0,   // >0 while tumbling from a bad crash, ignores dive input
  bailSpin: 0,    // accumulated visual tumble rotation while bailing

  reset: function () {
    this.x = 0;
    this.y = terrain.y(0);
    this.speed = TUNING.minSpeed * 1.3;
    this.vx = this.speed;
    this.vy = 0;
    this.state = "GROUNDED";
    this.diveHeld = false;
    this.combo = 0;
    this.distance = 0;
    this.angle = 0;
    this.bailTimer = 0;
    this.bailSpin = 0;
  },

  // Unified physics step, modeled on the reference implementations
  // (haqu/tiny-wings' Box2D body, ncase/Pony-Wings): apply acceleration,
  // integrate position freely every frame regardless of state, then react
  // to the terrain afterward. Leaving the ground / landing falls out of
  // that collision check on its own -- there's no separate analytic
  // "should I launch" formula to fight with, which is what was producing
  // near-instant micro-hops instead of real airtime.
  update: function (dt) {
    var wasGrounded = this.state === "GROUNDED";

    if (this.bailTimer > 0 && wasGrounded) {
      this.bailTimer = Math.max(0, this.bailTimer - dt);
      this.bailSpin += TUNING.landing.bailSpinSpeed * dt;
    }

    if (this.diveHeld && this.bailTimer <= 0) {
      if (wasGrounded) {
        var slope = terrain.slope(this.x);
        if (slope > TUNING.groundPump.flatEpsilon) {
          this.vy += TUNING.gravity * TUNING.groundPump.descendMult * dt;
        } else {
          this.vx += TUNING.groundPump.ascendForwardAccel * dt;
        }
      } else {
        this.vy += TUNING.gravity * TUNING.diveGravityMult * dt;
        this.vx += TUNING.diveForwardAccel * dt;
      }
    } else {
      this.vy += TUNING.gravity * dt; // baseline gravity, grounded or not
    }

    this.vx = clamp(this.vx, TUNING.minForwardVel, TUNING.maxSpeed);
    this.vy = clamp(this.vy, -TUNING.maxSpeed, TUNING.maxFallSpeed);

    this.x += this.vx * dt;
    this.y += this.vy * dt;

    var groundY = terrain.y(this.x);
    if (this.y >= groundY) {
      if (wasGrounded) {
        this.snapToGround(groundY);
      } else {
        this.land(groundY);
      }
    } else {
      this.state = "AIRBORNE";
      this.speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
      this.bailTimer = 0; // a real launch off a crest ends the tumble
    }

    this.angle = Math.atan2(this.vy, this.vx);
    this.distance = Math.max(this.distance, this.x);
  },

  // Continuously-grounded frame: stick to the surface and re-project
  // velocity onto the new tangent, same math `land()` uses but with no
  // scoring -- this is what keeps the player following the terrain's curve
  // (and gaining/losing speed with it) while already skiing.
  snapToGround: function (groundY) {
    this.y = groundY;
    var slope = terrain.slope(this.x);
    var invNorm = 1 / Math.sqrt(1 + slope * slope);
    var Tx = invNorm, Ty = slope * invNorm;

    var speedAlong = this.vx * Tx + this.vy * Ty;
    speedAlong = clamp(speedAlong, TUNING.minSpeed, TUNING.maxSpeed);
    this.speed = speedAlong;
    this.vx = Tx * speedAlong;
    this.vy = Ty * speedAlong;
    this.state = "GROUNDED";
  },

  land: function (groundY) {
    this.y = groundY;
    var slope = terrain.slope(this.x);
    var invNorm = 1 / Math.sqrt(1 + slope * slope);
    var Tx = invNorm, Ty = slope * invNorm;

    var speedMag = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    var velAngle = Math.atan2(this.vy, this.vx);
    var tangentAngle = Math.atan2(Ty, Tx);
    var delta = Math.abs(normalizeAngle(velAngle - tangentAngle));

    var isDownslope = slope > 0.02;
    var perfect = isDownslope && delta < TUNING.landing.perfectAngleThreshold;

    if (perfect) {
      speedMag = Math.min(speedMag * TUNING.landing.perfectSpeedBonus, TUNING.maxSpeed);
      this.combo = Math.min(this.combo + 1, TUNING.combo.max);
      var mult = 1 + this.combo * TUNING.combo.step;
      game.addScore(Math.round(20 * mult));
      game.spawnPopup("PERFECT" + (this.combo > 1 ? " x" + this.combo : ""), this.x, this.y - 50, ASSETS.hud.perfectColor);
    } else {
      var penalty = clamp(delta / Math.PI, 0, 1) * TUNING.landing.penaltyStrength;
      var factor = clamp(1 - penalty, TUNING.landing.minPenaltyFactor, 1);
      speedMag *= factor;
      this.combo = 0;

      if (delta > TUNING.landing.bailAngleThreshold) {
        speedMag *= TUNING.landing.bailSpeedFactor; // extra harsh on top -- this is a genuine crash
        this.bailTimer = TUNING.landing.bailDuration;
        this.bailSpin = 0;
        game.spawnPopup("BAILED!", this.x, this.y - 50, ASSETS.hud.bailColor);
        triggerCameraShake(TUNING.landing.bailShakeMag, TUNING.landing.bailShakeDuration);
      }
    }

    speedMag = clamp(speedMag, TUNING.minSpeed, TUNING.maxSpeed);
    this.speed = speedMag;
    this.vx = Math.max(Tx * speedMag, TUNING.minForwardVel);
    this.vy = Ty * speedMag;
    this.state = "GROUNDED";
  }
};

// ===========================================================================
// 5. Pickups — spawner, collision, effects
// ===========================================================================
var pickups = {
  list: [],

  reset: function () { this.list = []; },

  pickWeightedType: function () {
    var w = TUNING.pickups.weights;
    var total = w.coin + w.boost + w.battery;
    var r = Math.random() * total;
    if (r < w.coin) return "coin";
    r -= w.coin;
    if (r < w.boost) return "boost";
    return "battery";
  },

  trySpawnForHill: function (prevKp, newKp) {
    if (Math.random() > TUNING.pickups.spawnChancePerHill) return;
    var type = this.pickWeightedType();
    var wasPeak = newKp.y > prevKp.y; // descending after prev => prev was a local high point
    var placeArc = wasPeak && Math.random() < 0.5;

    var x, y;
    if (placeArc) {
      x = prevKp.x + (newKp.x - prevKp.x) * randRange(0.25, 0.55);
      y = prevKp.y - TUNING.pickups.arcHeight;
    } else {
      x = lerp(prevKp.x, newKp.x, randRange(0.3, 0.7));
      y = terrain.y(x) - 30;
    }
    this.list.push({ type: type, x: x, y: y, collected: false, t: Math.random() * 10 });
  },

  update: function (dt) {
    var t = TUNING.pickups;
    for (var i = 0; i < this.list.length; i++) {
      var p = this.list[i];
      if (p.collected) continue;
      p.t += dt;
      var dx = player.x - p.x, dy = player.y - p.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < t.magnetRadius) {
        var pull = clamp(t.magnetPull * dt, 0, 1);
        p.x += dx * pull;
        p.y += dy * pull;
      }
      if (dist < t.collectRadius) this.collect(p);
    }
    // cull collected / far-behind pickups
    var cutoff = camera.x - W;
    this.list = this.list.filter(function (p) { return !p.collected && p.x > cutoff; });
  },

  collect: function (p) {
    p.collected = true;
    var t = TUNING.pickups;
    if (p.type === "coin") {
      game.addScore(t.coinScore);
      game.spawnPopup("+" + t.coinScore, p.x, p.y - 20, ASSETS.pickups.coin.color);
    } else if (p.type === "boost") {
      player.speed = Math.min(player.speed + t.boostAmount, TUNING.maxSpeed);
      var mag = Math.sqrt(player.vx * player.vx + player.vy * player.vy) || 1;
      var scale = player.speed / mag;
      player.vx *= scale;
      player.vy *= scale;
      game.addScore(t.boostScore);
      game.spawnPopup("BOOST!", p.x, p.y - 20, ASSETS.pickups.boost.color);
    } else if (p.type === "battery") {
      game.battery = Math.min(TUNING.battery.max, game.battery + TUNING.battery.refillPickup);
      game.spawnPopup("+BATTERY", p.x, p.y - 20, ASSETS.pickups.battery.color);
    }
  },

  draw: function (ctx) {
    for (var i = 0; i < this.list.length; i++) {
      var p = this.list[i];
      if (p.collected) continue;
      var s = worldToScreen(p.x, p.y);
      ASSETS.pickups[p.type].draw(ctx, s.x, s.y, p.t);
    }
  }
};

// ===========================================================================
// 6. Camera — follow + speed zoom
// ===========================================================================
var camera = {
  x: 0, y: 0, zoom: 1,
  shakeTime: 0, shakeDurationInitial: 0, shakeMagInitial: 0,
  shakeOffsetX: 0, shakeOffsetY: 0
};

function triggerCameraShake(magnitude, duration) {
  camera.shakeTime = duration;
  camera.shakeDurationInitial = duration;
  camera.shakeMagInitial = magnitude;
}

function worldToScreen(wx, wy) {
  return {
    x: (wx - camera.x) * camera.zoom + W * TUNING.camera.leadFraction + camera.shakeOffsetX,
    y: (wy - camera.y) * camera.zoom + H * 0.5 + camera.shakeOffsetY
  };
}

function updateCamera(dt) {
  var c = TUNING.camera;
  camera.x = easeTowards(camera.x, player.x, c.easeX, dt);

  // Only ever bias the view toward MORE GROUND, never toward more sky.
  // A signed lookahead (climb = look up) left the player blind on the way
  // up a jump, since there's nothing useful to see above -- what matters
  // is the landing zone ahead/below, whether still climbing or falling.
  var lookahead = clamp(player.vy * c.vertLookaheadTime, 0, c.vertLookaheadMax);
  var vEase = player.state === "AIRBORNE" ? c.easeYAirborne : c.easeY;
  camera.y = easeTowards(camera.y, player.y + lookahead, vEase, dt);

  // zoom out for speed AND for altitude -- being high above the terrain
  // needs visibility just as much as going fast does, and a dive that's
  // both fast and high should pull back further than either alone
  var speedRatio = clamp(player.speed / c.zoomSpeedRef, 0, 1);
  var altitude = Math.max(0, terrain.y(player.x) - player.y);
  var altRatio = clamp(altitude / c.zoomAltRef, 0, 1);
  var zoomRatio = clamp(speedRatio + altRatio, 0, 1);
  // any time in the air at all, guarantee at least a minimum pull-back so
  // the incoming ground is never out of frame, even on a modest hop
  if (player.state === "AIRBORNE") {
    zoomRatio = Math.max(zoomRatio, c.zoomAirborneMin);
  }
  var targetZoom = lerp(c.zoomMax, c.zoomMin, zoomRatio);
  camera.zoom = easeTowards(camera.zoom, targetZoom, c.easeZoom, dt);

  if (camera.shakeTime > 0) {
    camera.shakeTime = Math.max(0, camera.shakeTime - dt);
    var shakeRatio = camera.shakeTime / camera.shakeDurationInitial;
    var mag = camera.shakeMagInitial * shakeRatio;
    camera.shakeOffsetX = (Math.random() * 2 - 1) * mag;
    camera.shakeOffsetY = (Math.random() * 2 - 1) * mag;
  } else {
    camera.shakeOffsetX = 0;
    camera.shakeOffsetY = 0;
  }
}

// ===========================================================================
// speed streaks -- purely cosmetic "sense of speed" trail behind the player
// ===========================================================================
var speedStreaks = [];
function updateSpeedStreaks(dt) {
  var fx = TUNING.speedFx;
  var ratio = clamp((player.speed - fx.threshold) / (fx.maxRef - fx.threshold), 0, 1);
  if (ratio > 0 && Math.random() < ratio * fx.spawnChance) {
    speedStreaks.push({
      x: player.x - randRange(10, 40),
      y: player.y + randRange(-45, 45),
      len: lerp(fx.minLen, fx.maxLen, ratio) * randRange(0.7, 1.3),
      life: fx.lifeTime,
      maxLife: fx.lifeTime
    });
  }
  for (var i = speedStreaks.length - 1; i >= 0; i--) {
    speedStreaks[i].life -= dt;
    if (speedStreaks[i].life <= 0) speedStreaks.splice(i, 1);
  }
}
function drawSpeedStreaks() {
  for (var i = 0; i < speedStreaks.length; i++) {
    var p = speedStreaks[i];
    var s = worldToScreen(p.x, p.y);
    var alpha = clamp(p.life / p.maxLife, 0, 1) * 0.55;
    ctx.strokeStyle = "rgba(" + ASSETS.speedStreak.color + "," + alpha + ")";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - p.len * camera.zoom, s.y);
    ctx.stroke();
  }
}

// ===========================================================================
// clouds (decorative parallax layer)
// ===========================================================================
var clouds = [];
function initClouds() {
  clouds = [];
  for (var i = 0; i < 8; i++) {
    clouds.push({
      x: randRange(0, 2000),
      y: randRange(40, 220),    // fixed screen-space Y -- never moves with camera/zoom
      scale: randRange(0.6, 1.2),
      parallax: randRange(0.02, 0.05)
    });
  }
}

// ===========================================================================
// 7. Renderer — sky, parallax hills, terrain, pickups, player, HUD
// ===========================================================================
function drawSky() {
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, ASSETS.sky.top);
  g.addColorStop(1, ASSETS.sky.bottom);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

var CLOUD_WRAP = 2000;
function drawClouds() {
  for (var i = 0; i < clouds.length; i++) {
    var c = clouds[i];
    var scroll = camera.x * c.parallax;
    var sx = ((c.x - scroll) % CLOUD_WRAP + CLOUD_WRAP) % CLOUD_WRAP - 150;
    ASSETS.clouds.draw(ctx, sx, c.y, c.scale);
  }
}

// A distant backdrop, drawn entirely in screen space -- deliberately NOT
// derived from world Y or camera.zoom (see ASSETS.backgroundHills), so a
// dive's zoom/altitude swings can never make it swell or jump around.
// Only a slow horizontal drift, like a painted-far-away hillside.
function drawBackgroundHills() {
  var layers = ASSETS.backgroundHills;
  for (var li = 0; li < layers.length; li++) {
    var layer = layers[li];
    ctx.fillStyle = layer.fill;
    ctx.beginPath();
    var baseY = H * layer.baseYFrac;
    var scroll = camera.x * layer.parallax;
    var first = true;
    for (var sx = -layer.wavelength; sx <= W + layer.wavelength; sx += 20) {
      var y = baseY + Math.sin((sx + scroll) / layer.wavelength * Math.PI * 2) * layer.amp;
      if (first) { ctx.moveTo(sx, y); first = false; } else ctx.lineTo(sx, y);
    }
    ctx.lineTo(W + layer.wavelength, H);
    ctx.lineTo(-layer.wavelength, H);
    ctx.closePath();
    ctx.fill();
  }
}

// Renders the terrain as a staircase of flat-shaded rectangular columns
// instead of a smooth curve -- genuine blocky pixel-art geometry, drawn
// sharp at full resolution (no downsampling/blur, unlike an upscaled
// low-res buffer). The column grid is anchored to WORLD space (not screen
// space), so a given stretch of hill always quantizes to the same blocks
// regardless of scroll position -- that's what keeps the steps stable
// while scrolling instead of shimmering/crawling.
function drawTerrain(targetCtx) {
  var kp = terrain.keyPoints;
  var islands = ASSETS.terrain.islands;
  var worldLeft = camera.x - 200 / camera.zoom;
  var worldRight = camera.x + (W + 200) / camera.zoom;
  var block = TUNING.terrain.pixelBlockSize;

  var startX = Math.floor(worldLeft / block) * block;
  var endX = Math.ceil(worldRight / block) * block;

  targetCtx.beginPath();
  var prevBlockY = null;
  for (var wx = startX; wx < endX; wx += block) {
    var sampleX = wx + block * 0.5;
    var worldY = terrain.y(sampleX);
    var blockY = Math.round(worldY / block) * block;

    var seg = kp[terrain.segmentIndexAt(sampleX)];
    var palette = islands[seg.islandIndex % islands.length];
    var color = (seg.hillIndex % 2 === 0) ? palette.fill : palette.stripe;

    var topLeft = worldToScreen(wx, blockY);
    var botRight = worldToScreen(wx + block, blockY + 6000);

    // floor/ceil with 1px overlap so neighboring columns never leave a
    // hairline seam between them at fractional screen coordinates
    var rx = Math.floor(topLeft.x);
    var ry = Math.floor(topLeft.y);
    var rw = Math.ceil(botRight.x) - rx + 1;
    var rh = Math.ceil(botRight.y) - ry;
    targetCtx.fillStyle = color;
    targetCtx.fillRect(rx, ry, rw, rh);

    // stepped outline: a flat tread across this column, a vertical riser
    // wherever the height changed from the column before it
    if (prevBlockY === null) {
      targetCtx.moveTo(topLeft.x, topLeft.y);
    } else if (blockY !== prevBlockY) {
      targetCtx.lineTo(topLeft.x, topLeft.y);
    }
    var topRight = worldToScreen(wx + block, blockY);
    targetCtx.lineTo(topRight.x, topRight.y);
    prevBlockY = blockY;
  }

  targetCtx.strokeStyle = ASSETS.terrain.outline;
  targetCtx.lineWidth = 2;
  targetCtx.stroke();
}

function drawPlayer() {
  var s = worldToScreen(player.x, player.y);
  var state, angle;
  if (player.bailTimer > 0) {
    state = "BAIL";
    angle = player.bailSpin; // uncontrolled tumble, overrides the normal slope/velocity angle
  } else {
    state = (player.state === "AIRBORNE" && player.diveHeld) ? "AIRBORNE_DIVE" : player.state;
    angle = player.angle;
  }
  ASSETS.player.draw(ctx, s.x, s.y, angle, state, player.speed);
}

function render() {
  drawSky();
  drawClouds();
  drawBackgroundHills();
  drawTerrain(ctx);
  pickups.draw(ctx);
  drawSpeedStreaks();
  drawPlayer();
  drawHUD();
}

// ===========================================================================
// 8. HUD — score, combo, speed, battery bar, mission timer, section
//    banners, PERFECT popups, title/gameover/win
// ===========================================================================
function formatTime(seconds) {
  seconds = Math.max(0, seconds);
  var m = Math.floor(seconds / 60);
  var s = Math.floor(seconds % 60);
  return m + ":" + (s < 10 ? "0" : "") + s;
}

function drawHUD() {
  var hud = ASSETS.hud;
  ctx.save();
  ctx.textBaseline = "top";
  ctx.shadowColor = hud.shadow;
  ctx.shadowBlur = 4;

  // score
  ctx.fillStyle = hud.text;
  ctx.font = "bold 26px sans-serif";
  ctx.fillText("Score: " + game.score, 16, 14);

  // combo
  if (player.combo > 1) {
    ctx.fillStyle = hud.comboColor;
    ctx.font = "bold 20px sans-serif";
    ctx.fillText("Combo x" + player.combo, 16, 46);
  }

  // speed readout
  ctx.fillStyle = hud.text;
  ctx.font = "16px sans-serif";
  ctx.fillText(Math.round(player.speed) + " px/s", 16, 74);

  // current section name, small persistent label
  var sectionName = TUNING.journey.sections[game.sectionIndex] ? TUNING.journey.sections[game.sectionIndex].name : "";
  ctx.fillStyle = hud.sectionColor;
  ctx.font = "bold 14px sans-serif";
  ctx.fillText(sectionName, 16, 96);

  // battery bar (top-right)
  var barW = Math.min(260, W * 0.4), barH = 16;
  var barX = W - barW - 16, barY = 16;
  ctx.shadowBlur = 0;
  ctx.fillStyle = hud.batteryBarBg;
  roundRect(ctx, barX, barY, barW, barH, 8);
  ctx.fill();
  var frac = clamp(game.battery / TUNING.battery.max, 0, 1);
  ctx.fillStyle = frac < 0.2 ? hud.batteryBarLow : hud.batteryBarFill;
  roundRect(ctx, barX, barY, barW * frac, barH, 8);
  ctx.fill();

  // mission timer, under the battery bar
  ctx.shadowColor = hud.shadow;
  ctx.shadowBlur = 4;
  ctx.textAlign = "right";
  ctx.font = "bold 18px sans-serif";
  ctx.fillStyle = game.missionTimer < 15 ? hud.timeLowColor : hud.text;
  ctx.fillText(formatTime(game.missionTimer), W - 16, barY + barH + 8);
  ctx.textAlign = "left";

  // popups
  ctx.font = "bold 22px sans-serif";
  ctx.textAlign = "center";
  for (var i = 0; i < game.popups.length; i++) {
    var p = game.popups[i];
    var s = worldToScreen(p.x, p.y - (1 - p.life / p.maxLife) * 60);
    ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, s.x, s.y);
  }
  ctx.globalAlpha = 1;

  // section banner -- a big centered "road sign" reveal, screen-anchored
  if (game.sectionBanner) {
    var b = game.sectionBanner;
    var fadeIn = clamp((b.maxLife - b.life) / 0.3, 0, 1);
    var fadeOut = clamp(b.life / 0.5, 0, 1);
    ctx.globalAlpha = Math.min(fadeIn, fadeOut);
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fillRect(0, H * 0.3, W, 90);
    ctx.fillStyle = hud.sectionColor;
    ctx.font = "bold 40px sans-serif";
    ctx.fillText(b.text, W / 2, H * 0.3 + 20);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = "left";

  if (game.state === "TITLE") drawTitleScreen();
  else if (game.state === "GAMEOVER") drawGameOverScreen();
  else if (game.state === "WIN") drawWinScreen();

  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  w = Math.max(w, 0);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawTitleScreen() {
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = ASSETS.hud.titleColor;
  ctx.font = "bold 56px sans-serif";
  ctx.fillText("DOWNHILL PHIL", W / 2, H / 2 - 60);
  ctx.font = "28px sans-serif";
  ctx.fillText("tap, click, or press space to dive", W / 2, H / 2 + 10);
  ctx.textAlign = "left";
}

function drawGameOverScreen() {
  var message = game.failReason === "TIME" ? "Ran out of time" : "Battery died";
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = ASSETS.hud.titleColor;
  ctx.font = "bold 44px sans-serif";
  ctx.fillText(message, W / 2, H / 2 - 70);
  ctx.font = "bold 32px sans-serif";
  ctx.fillText("Score: " + game.score, W / 2, H / 2 - 10);
  ctx.font = "22px sans-serif";
  ctx.fillText("tap to try again", W / 2, H / 2 + 40);
  ctx.textAlign = "left";
}

function drawWinScreen() {
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = ASSETS.hud.titleColor;
  ctx.font = "bold 44px sans-serif";
  ctx.fillText("You made it home!", W / 2, H / 2 - 90);
  ctx.font = "bold 32px sans-serif";
  ctx.fillText("Score: " + game.score, W / 2, H / 2 - 30);
  ctx.font = "22px sans-serif";
  ctx.fillText("Time left: " + formatTime(game.missionTimer), W / 2, H / 2 + 10);
  ctx.fillText("tap to ride again", W / 2, H / 2 + 50);
  ctx.textAlign = "left";
}

// ===========================================================================
// 9. Game — TITLE -> PLAYING -> GAMEOVER, fixed timestep loop, input, resize
// ===========================================================================
var game = {
  state: "TITLE", // TITLE | PLAYING | GAMEOVER | WIN
  score: 0,
  battery: TUNING.battery.max,
  missionTimer: TUNING.mission.timeLimit,
  sectionIndex: 0,
  failReason: "", // "BATTERY" | "TIME" -- which fail condition ended the run
  popups: [],
  sectionBanner: null, // {text, life, maxLife} -- one big centered "road sign" at a time
  gameOverCooldown: 0,

  start: function () {
    terrain.init();
    terrain.ensureGenerated(4000);
    pickups.reset();
    player.reset();
    camera.x = player.x;
    camera.y = player.y;
    camera.zoom = TUNING.camera.zoomMax;
    initClouds();
    speedStreaks = [];
    this.score = 0;
    this.battery = TUNING.battery.max;
    this.missionTimer = TUNING.mission.timeLimit;
    this.sectionIndex = 0;
    this.failReason = "";
    this.popups = [];
    this.state = "PLAYING";
    this.showSectionBanner(TUNING.journey.sections[0].name);
  },

  addScore: function (n) { this.score += n; },

  spawnPopup: function (text, x, y, color) {
    this.popups.push({ text: text, x: x, y: y, life: 1.0, maxLife: 1.0, color: color });
  },

  showSectionBanner: function (text) {
    this.sectionBanner = { text: text, life: 2.5, maxLife: 2.5 };
  },

  update: function (dt) {
    if (this.state !== "PLAYING") return;

    player.diveHeld = input.pressed;
    player.update(dt);

    terrain.ensureGenerated(player.x + 4000);
    terrain.cull(camera.x - W * 2);

    pickups.update(dt);
    updateCamera(dt);
    updateSpeedStreaks(dt);

    // battery only drains while actively diving -- coasting is free
    if (input.pressed) {
      this.battery -= TUNING.battery.drainRate * dt;
    }
    if (this.battery <= 0) {
      this.battery = 0;
      this.state = "GAMEOVER";
      this.failReason = "BATTERY";
      this.gameOverCooldown = 0.5;
      this.sectionBanner = null; // don't let a fading banner clash with the end screen
      return;
    }

    this.missionTimer -= dt;
    if (this.missionTimer <= 0) {
      this.missionTimer = 0;
      this.state = "GAMEOVER";
      this.failReason = "TIME";
      this.gameOverCooldown = 0.5;
      this.sectionBanner = null;
      return;
    }

    var newSection = sectionIndexAtDistance(player.x);
    if (newSection !== this.sectionIndex) {
      this.sectionIndex = newSection;
      this.showSectionBanner(TUNING.journey.sections[newSection].name);
    }

    if (player.x >= JOURNEY_TOTAL_DISTANCE) {
      this.state = "WIN";
      this.gameOverCooldown = 0.5;
      this.sectionBanner = null;
      return;
    }

    for (var i = this.popups.length - 1; i >= 0; i--) {
      var p = this.popups[i];
      p.life -= dt / 0.9;
      if (p.life <= 0) this.popups.splice(i, 1);
    }

    if (this.sectionBanner) {
      this.sectionBanner.life -= dt;
      if (this.sectionBanner.life <= 0) this.sectionBanner = null;
    }
  }
};

// ---------------------------------------------------------------------------
// input
// ---------------------------------------------------------------------------
var input = { pressed: false };

function onPressStart() {
  if (game.state === "TITLE") {
    game.start();
    return;
  }
  if (game.state === "GAMEOVER" || game.state === "WIN") {
    if (game.gameOverCooldown <= 0) game.start();
    return;
  }
  input.pressed = true;
}
function onPressEnd() {
  input.pressed = false;
}

canvas.addEventListener("pointerdown", function (e) { e.preventDefault(); onPressStart(); }, { passive: false });
window.addEventListener("pointerup", onPressEnd);
window.addEventListener("pointercancel", onPressEnd);
window.addEventListener("keydown", function (e) {
  if (e.code === "Space") { e.preventDefault(); onPressStart(); }
});
window.addEventListener("keyup", function (e) {
  if (e.code === "Space") { e.preventDefault(); onPressEnd(); }
});

// ---------------------------------------------------------------------------
// main loop — fixed 120Hz physics step via accumulator
// ---------------------------------------------------------------------------
var lastTime = 0, accumulator = 0;
function frame(now) {
  var dt = Math.min((now - lastTime) / 1000, 0.25);
  lastTime = now;
  accumulator += dt;

  if ((game.state === "GAMEOVER" || game.state === "WIN") && game.gameOverCooldown > 0) {
    game.gameOverCooldown -= dt;
  }

  while (accumulator >= TUNING.fixedDt) {
    game.update(TUNING.fixedDt);
    accumulator -= TUNING.fixedDt;
  }

  render();
  requestAnimationFrame(frame);
}

resize();
terrain.init();
terrain.ensureGenerated(4000);
initClouds();
camera.x = 0;
camera.y = terrain.y(0);
requestAnimationFrame(function (t) { lastTime = t; requestAnimationFrame(frame); });

})();
</script>
</body>
</html>
