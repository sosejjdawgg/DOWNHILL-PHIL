    bannerBg2: "rgba(255,61,166,0.35)",
    bannerBorder: "rgba(255,230,109,0.8)"
  }
};

// ===========================================================================
// 3. Terrain — cosine-interpolated hills, endless generation, culling
// ===========================================================================
var terrain = {
  keyPoints: [],
  generatedUntilX: 0,
  hillCount: 0,
  lastDir: -1,

  init: function () {
    this.keyPoints = [
      { x: -400, y: TUNING.terrain.baseline, hillIndex: 0 },
      { x: 0, y: TUNING.terrain.baseline, hillIndex: 0 }
    ];
    this.generatedUntilX = 0;
    this.hillCount = 0;
    this.lastDir = -1;
  },

  ensureGenerated: function (targetX) {
    targetX = Math.min(targetX, JOURNEY_TOTAL_DISTANCE);
    var flatStartX = JOURNEY_TOTAL_DISTANCE - TUNING.finish.flatZoneLength;

    while (this.generatedUntilX < targetX) {
      var last = this.keyPoints[this.keyPoints.length - 1];

      // Once the last hill has carried us into the flat-approach zone,
      // stop rolling hills entirely and lay one final point at baseline
      // right at the house -- guarantees the finish always sits on level
      // ground instead of wherever a random hill happened to end.
      if (last.x >= flatStartX) {
        this.hillCount++;
        var flatPoint = { x: JOURNEY_TOTAL_DISTANCE, y: TUNING.terrain.baseline, hillIndex: this.hillCount };
        this.keyPoints.push(flatPoint);
        this.generatedUntilX = JOURNEY_TOTAL_DISTANCE;
        break;
      }

      var t = TUNING.terrain;
      var diff = clamp(Math.max(0, last.x) / TUNING.difficulty.rampDistance, 0, 1);

      var width = lerp(t.minWidth, t.maxWidth, diff) * randRange(0.75, 1.25);

      // The very first hill gets a longer run so the opening descent
      // reads as a proper kicker ramp -- room to build speed before the
      // crest right after it launches the first small jump.
      if (this.hillCount === 0) {
        width *= 1.7;
      }

      // Strictly alternate up/down every hill -- matching haqu/tiny-wings'
      // terrain generator (`sign *= -1` each key point) -- so every key
      // point is a real peak or trough of the scalloped chain.
      var dir = -this.lastDir;
      this.lastDir = dir;

      // Dips (troughs, dir > 0) run deeper, fatter, and more varied than
      // peaks -- more room on the descent before the next climb starts,
      // instead of landing and slamming straight into a new ramp. Peaks
      // keep their original, gentler range.
      var amp = dir > 0
        ? lerp(t.minAmp, t.maxAmp, diff) * randRange(0.7, 2.4)
        : lerp(t.minAmp, t.maxAmp, diff) * randRange(0.55, 1.0);

      // Spread that extra depth over a much wider run on the way down --
      // fatter dips (more time actually in them, not just gliding past)
      // and a gentler slope for the same or greater depth, instead of a
      // sharper cliff.
      if (dir > 0) {
        width *= 1.9;
      }

      var newX = last.x + width;
      var newY;
      if (newX >= flatStartX) {
        // final approach hill -- ease all the way to baseline over its
        // natural width instead of to another random peak/trough, so the
        // flat run after it starts smoothly rather than as a jump cut
        newY = t.baseline;
      } else {
        newY = clamp(
          t.baseline + dir * amp,
          t.baseline - t.maxAmp * 2.2,
          t.baseline + t.maxAmp * 2.6
        );
      }

      this.hillCount++;

      var newPoint = { x: newX, y: newY, hillIndex: this.hillCount };
      this.keyPoints.push(newPoint);
      this.generatedUntilX = newX;

      pickups.trySpawnForHill(last, newPoint);
    }
  },

  cull: function (beforeX) {
    while (this.keyPoints.length > 4 && this.keyPoints[1].x < beforeX) {
      this.keyPoints.shift();
    }
  },

  // find index i such that keyPoints[i].x <= x < keyPoints[i+1].x
  segmentIndexAt: function (x) {
    var kp = this.keyPoints;
    var lo = 0, hi = kp.length - 2;
    if (x <= kp[0].x) return 0;
    if (x >= kp[kp.length - 1].x) return kp.length - 2;
    while (lo < hi) {
      var mid = (lo + hi + 1) >> 1;
      if (kp[mid].x <= x) lo = mid; else hi = mid - 1;
    }
    return lo;
  },

  y: function (x) {
    var kp = this.keyPoints;
    var i = this.segmentIndexAt(x);
    var a = kp[i], b = kp[i + 1];
    if (!b) return a.y;
    var span = b.x - a.x;
    var t = span > 0 ? clamp((x - a.x) / span, 0, 1) : 0;
    var mu2 = (1 - Math.cos(t * Math.PI)) / 2;
    return a.y * (1 - mu2) + b.y * mu2;
  },

  slope: function (x) {
    var eps = 4;
    return (this.y(x + eps) - this.y(x - eps)) / (2 * eps);
  }
};

// ===========================================================================
// 4. Player — grounded/airborne state machine, landing logic, combo
// ===========================================================================
var player = {
  x: 0, y: 0, vx: 0, vy: 0, speed: 0,
  angle: 0,
  state: "GROUNDED", // GROUNDED | AIRBORNE
  diveHeld: false,
  tiltHeld: false,     // hidden left-side touch zone, held while airborne
  wheelieActive: false, // hidden left-side touch zone, cosmetic while grounded
  tiltActiveTime: 0,   // s, continuous air-tilt use this flight -- resets on landing/release
  tiltCooldown: 0,     // s remaining before air-tilt works again, once maxContinuous is spent
  backflipTimer: 0,    // s remaining in a forced backflip (apple pickup), purely visual
  backflipDuration: 0, // duration of the current flip, for computing rotation progress
  combo: 0,
  distance: 0,
  bailTimer: 0,   // >0 while tumbling from a bad crash, ignores dive input
  bailSpin: 0,    // accumulated visual tumble rotation while bailing
  airTime: 0,     // s, continuous time airborne this flight (resets on landing)
  airTicks: 0,    // whole seconds of airTime already scored this flight
  airTimeScore: 0,   // score accumulated in the air this flight, shown as a floating counter above Phil
  airCounterPulse: 0, // 0-1, decaying "punch" applied to that counter on each tick

  reset: function () {
    this.x = 0;
    this.y = terrain.y(0);
    this.speed = TUNING.minSpeed * 1.3;
    this.vx = this.speed;
    this.vy = 0;
    this.state = "GROUNDED";
    this.diveHeld = false;
    this.tiltHeld = false;
    this.wheelieActive = false;
    this.tiltActiveTime = 0;
    this.tiltCooldown = 0;
    this.backflipTimer = 0;
    this.backflipDuration = 0;
    this.combo = 0;
    this.distance = 0;
    this.angle = 0;
    this.bailTimer = 0;
    this.bailSpin = 0;
    this.airTime = 0;
    this.airTicks = 0;
    this.airTimeScore = 0;
    this.airCounterPulse = 0;
  },

  // Unified physics step, modeled on the reference implementations
  // (haqu/tiny-wings' Box2D body, ncase/Pony-Wings): apply acceleration,
  // integrate position freely every frame regardless of state, then react
  // to the terrain afterward. Leaving the ground / landing falls out of
  // that collision check on its own -- there's no separate analytic
  // "should I launch" formula to fight with, which is what was producing
  // near-instant micro-hops instead of real airtime.
  update: function (dt) {
    var wasGrounded = this.state === "GROUNDED";

    if (this.airCounterPulse > 0) {
      this.airCounterPulse = Math.max(0, this.airCounterPulse - dt / TUNING.airtime.pulseDuration);
    }

    if (this.backflipTimer > 0) {
      this.backflipTimer = Math.max(0, this.backflipTimer - dt);
    }

    if (this.bailTimer > 0 && wasGrounded) {
      this.bailTimer = Math.max(0, this.bailTimer - dt);
      this.bailSpin += TUNING.landing.bailSpinSpeed * dt;
    }

    if (this.diveHeld && this.bailTimer <= 0) {
      if (wasGrounded) {
        var slope = terrain.slope(this.x);
        if (slope > TUNING.groundPump.flatEpsilon) {
          this.vy += TUNING.gravity * TUNING.groundPump.descendMult * dt;
        } else {
          this.vx += TUNING.groundPump.ascendForwardAccel * dt;
        }
      } else {
        this.vy += TUNING.gravity * TUNING.diveGravityMult * dt;
        this.vx += TUNING.diveForwardAccel * dt;

        // diveGravityMult saturates vy almost instantly while vx creeps up
        // over the same short window, so left alone the dive pitches to a
        // near-vertical nosedive -- clamp the angle (speed-preserving) so
        // holding dive never pitches steeper than diveMaxAngle
        var diveAngle = Math.atan2(this.vy, this.vx);
        if (diveAngle > TUNING.diveMaxAngle) {
          var diveSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
          this.vx = diveSpeed * Math.cos(TUNING.diveMaxAngle);
          this.vy = diveSpeed * Math.sin(TUNING.diveMaxAngle);
        }
      }
    } else {
      this.vy += TUNING.gravity * dt; // baseline gravity, grounded or not
    }

    // Hidden left-side touch zone while airborne: tip backward, rotating
    // the velocity vector nose-up (speed preserved) so a bad launch angle
    // can be steered into a cleaner landing. Budgeted + cooled down (see
    // TUNING.airTilt) so it can't be held indefinitely to keep injecting
    // gravity's fresh energy back upward and staying aloft forever.
    if (this.tiltCooldown > 0) {
      this.tiltCooldown = Math.max(0, this.tiltCooldown - dt);
    }
    if (this.tiltHeld && !wasGrounded && this.bailTimer <= 0 && this.tiltCooldown <= 0) {
      var curAngle = Math.atan2(this.vy, this.vx);
      var newAngle = Math.max(TUNING.airTilt.minAngle, curAngle - TUNING.airTilt.rate * dt);
      var tiltSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
      this.vx = tiltSpeed * Math.cos(newAngle);
      this.vy = tiltSpeed * Math.sin(newAngle);

      this.tiltActiveTime += dt;
      if (this.tiltActiveTime >= TUNING.airTilt.maxContinuous) {
        this.tiltCooldown = TUNING.airTilt.cooldown;
        this.tiltActiveTime = 0;
      }
    } else if (!this.tiltHeld) {
      this.tiltActiveTime = 0;
    }

    this.vx = clamp(this.vx, TUNING.minForwardVel, TUNING.maxSpeed);
    this.vy = clamp(this.vy, -TUNING.maxSpeed, TUNING.maxFallSpeed);

    this.x += this.vx * dt;
    this.y += this.vy * dt;

    var groundY = terrain.y(this.x);
    if (this.y >= groundY) {
      if (wasGrounded) {
        this.snapToGround(groundY);
      } else {
        this.land(groundY);
      }
    } else {
      this.state = "AIRBORNE";
      this.speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
      this.bailTimer = 0; // a real launch off a crest ends the tumble

      this.airTime += dt;
      var pastDelay = this.airTime - TUNING.airtime.startDelay;
      var ticksSoFar = pastDelay > 0 ? Math.floor(pastDelay / TUNING.airtime.tickInterval) : 0;
      if (ticksSoFar > this.airTicks) {
        this.airTicks = ticksSoFar;
        game.onAirtimeTick();
      }
    }

    this.angle = Math.atan2(this.vy, this.vx);
    this.distance = Math.max(this.distance, this.x);
  },

  // Continuously-grounded frame: stick to the surface and re-project
  // velocity onto the new tangent, same math `land()` uses but with no
  // scoring -- this is what keeps the player following the terrain's curve
  // (and gaining/losing speed with it) while already skiing.
  snapToGround: function (groundY) {
    this.y = groundY;
    var slope = terrain.slope(this.x);
    var invNorm = 1 / Math.sqrt(1 + slope * slope);
    var Tx = invNorm, Ty = slope * invNorm;

    var speedAlong = this.vx * Tx + this.vy * Ty;
    speedAlong = clamp(speedAlong, TUNING.minSpeed, TUNING.maxSpeed);
    this.speed = speedAlong;
    this.vx = Tx * speedAlong;
    this.vy = Ty * speedAlong;
    this.state = "GROUNDED";
  },

  startBackflip: function () {
    this.backflipDuration = TUNING.apple.backflipDuration;
    this.backflipTimer = TUNING.apple.backflipDuration;
  },

  land: function (groundY) {
    this.airTime = 0;
    this.airTicks = 0;
    this.tiltActiveTime = 0;
    this.tiltCooldown = 0;
    this.backflipTimer = 0;
    this.y = groundY;
    var slope = terrain.slope(this.x);
    var invNorm = 1 / Math.sqrt(1 + slope * slope);
    var Tx = invNorm, Ty = slope * invNorm;

    var speedMag = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    var velAngle = Math.atan2(this.vy, this.vx);
    var tangentAngle = Math.atan2(Ty, Tx);
    var delta = Math.abs(normalizeAngle(velAngle - tangentAngle));

    // The terrain's cosine easing means slope reads ~0 exactly at every
    // hilltop/valley keypoint by construction -- so a landing timed right
    // at a crest would almost always fail a strict "must be descending"
    // check through no fault of the player. Only exclude a genuine
    // uphill-face slam here; a flat or gently-rising crest still counts.
    var isDownslope = slope > -0.3;
    var perfect = isDownslope && delta < TUNING.landing.perfectAngleThreshold;
    var isBail = delta > TUNING.landing.bailAngleThreshold;

    if (perfect) {
      speedMag = Math.min(speedMag * TUNING.landing.perfectSpeedBonus, TUNING.maxSpeed);
      this.combo = Math.min(this.combo + 1, TUNING.combo.max);
      var mult = 1 + this.combo * TUNING.combo.step;
      game.addScore(Math.round(20 * mult));
      game.spawnPopup("PERFECT" + (this.combo > 1 ? " x" + this.combo : ""), this.x, this.y - 50, ASSETS.hud.perfectColor);
    } else {
      var penalty = clamp(delta / Math.PI, 0, 1) * TUNING.landing.penaltyStrength;
      var factor = clamp(1 - penalty, TUNING.landing.minPenaltyFactor, 1);
      speedMag *= factor;
      this.combo = 0;

      if (isBail) {
        speedMag *= TUNING.landing.bailSpeedFactor; // extra harsh on top -- this is a genuine crash
        this.bailTimer = TUNING.landing.bailDuration;
        this.bailSpin = 0;
        game.spawnPopup("BAILED!", this.x, this.y - 50, ASSETS.hud.bailColor);
        triggerCameraShake(TUNING.landing.bailShakeMag, TUNING.landing.bailShakeDuration);
      }
    }

    // Resolve the pending airtime bonus banked during this flight: a
    // perfect downslope landing doubles it into the score, a bail crosses
    // it out and loses it entirely, anything else banks it as-is.
    if (this.airTimeScore > 0) {
      var pending = this.airTimeScore;
      if (perfect) {
        var doubled = pending * 2;
        game.addScore(doubled);
        game.scorePulse = 1;
        game.spawnAirResolve("double", pending, doubled, this.x, this.y);
        playChaChingSound();
      } else if (isBail) {
        game.spawnAirResolve("lost", pending, 0, this.x, this.y);
      } else {
        game.addScore(pending);
        game.scorePulse = 1;
        game.spawnAirResolve("banked", pending, pending, this.x, this.y);
        playChaChingSound();
      }
    }
    this.airTimeScore = 0;

    speedMag = clamp(speedMag, TUNING.minSpeed, TUNING.maxSpeed);
    this.speed = speedMag;
    this.vx = Math.max(Tx * speedMag, TUNING.minForwardVel);
    this.vy = Ty * speedMag;
    this.state = "GROUNDED";
  }
};

// Tiny orbiting twinkle dots shared by every pickup type -- cheap way to
// make them read as "intensely interesting" collectibles rather than a
// flat sat-on-the-ground circle.
function drawPickupSparkle(ctx, x, y, t, radius, color) {
  var count = 3;
  for (var i = 0; i < count; i++) {
    var phase = t * 2.2 + i * (Math.PI * 2 / count);
    var twinkle = 0.35 + 0.65 * Math.max(0, Math.sin(t * 5 + i * 2.1));
    if (twinkle < 0.08) continue;
    var sx = x + Math.cos(phase) * radius;
    var sy = y + Math.sin(phase) * radius * 0.55;
    ctx.save();
    ctx.globalAlpha = twinkle;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(sx, sy, 1.7, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ===========================================================================
// 5. Pickups — spawner, collision, effects
// ===========================================================================
var pickups = {
  list: [],

  reset: function () { this.list = []; },

  pickWeightedType: function () {
    var w = TUNING.pickups.weights;
    var total = w.coin + w.boost + w.battery;
    var r = Math.random() * total;
    if (r < w.coin) return "coin";
    r -= w.coin;
    if (r < w.boost) return "boost";
    return "battery";
  },

  trySpawnForHill: function (prevKp, newKp) {
    var wasPeak = newKp.y > prevKp.y; // descending after prev => prev was a local high point

    // Apple is a separate, rare "reach for it" pickup living at roughly
    // where a good clean jump off this peak actually apexes -- rolled
    // independently of the normal spawn gate below so it doesn't compete
    // with (or get crowded out by) the regular coin/boost/battery spawn
    // on the same hill. Clamped to the segment width so a shorter hill
    // (dip segments here are already widened elsewhere, but stay safe)
    // still places it somewhere reachable rather than past the far end.
    if (wasPeak && Math.random() < TUNING.pickups.appleChance) {
      var span = newKp.x - prevKp.x;
      var apexDx = Math.min(TUNING.pickups.appleApexDx, span * 0.7);
      var apexHeight = TUNING.pickups.appleApexHeight * (apexDx / TUNING.pickups.appleApexDx);
      var ax = prevKp.x + apexDx;
      var ay = prevKp.y - apexHeight;
      this.list.push({ type: "apple", x: ax, y: ay, collected: false, t: Math.random() * 10, small: false });
    }

    if (Math.random() > TUNING.pickups.spawnChancePerHill) return;
    var type = this.pickWeightedType();

    if (type === "battery") {
      // A row of batteries hugging the hill's own contour -- only the
      // first is visible/collectible; collecting it reveals the next one
      // in sequence. The charge is only granted once the whole row is
      // collected, so a half-finished row pays out nothing.
      var span = newKp.x - prevKp.x;
      var n = TUNING.battery.rowSize;
      var spacing = Math.min(TUNING.battery.rowSpacing, span / (n + 1.5));
      var startT = randRange(0.12, 0.3);
      var startX = prevKp.x + span * startT;
      var group = { size: n, revealIndex: 0 };
      for (var bi = 0; bi < n; bi++) {
        var px = startX + bi * spacing;
        var py = terrain.y(px) - 42; // hovers just clear of the ground, riding the slope's own shape
        this.list.push({ type: type, x: px, y: py, collected: false, t: Math.random() * 10, small: false, group: group, groupIndex: bi });
      }
      return;
    }

    if (wasPeak) {
      // coin/boost ride a little rainbow of 3 smaller pickups off the jump
      // -- collected mid-air on the way down, ready for the player coming
      // off the ramp, instead of one item sitting flat on the ground.
      // Height is measured from the LOCAL ground at each item's own x, not
      // the peak's height -- dips are now much deeper/wider than when this
      // was first written (see terrain.ensureGenerated), so a peak-relative
      // offset put the later items in the arc 300-400+ world px above the
      // actual ground beneath them as the descent dropped away under a
      // fixed height, floating far out of reach instead of riding along
      // just above the slope.
      var count = 3;
      for (var i = 0; i < count; i++) {
        var tRel = i / (count - 1); // 0, 0.5, 1
        var tSeg = lerp(0.2, 0.62, tRel);
        var x = lerp(prevKp.x, newKp.x, tSeg);
        var rainbow = 0.55 + 0.45 * Math.sin(Math.PI * tRel); // 0.55 at the ends, 1.0 in the middle
        var y = terrain.y(x) - TUNING.pickups.arcHeight * rainbow;
        this.list.push({ type: type, x: x, y: y, collected: false, t: Math.random() * 10, small: true });
      }
    } else {
      var gx = lerp(prevKp.x, newKp.x, randRange(0.3, 0.7));
      var gy = terrain.y(gx) - 50;
      this.list.push({ type: type, x: gx, y: gy, collected: false, t: Math.random() * 10, small: false });
    }
  },

  update: function (dt) {
    var t = TUNING.pickups;
    for (var i = 0; i < this.list.length; i++) {
      var p = this.list[i];
      if (p.collected) continue;
      p.t += dt;
      if (p.group && p.groupIndex !== p.group.revealIndex) continue; // still hidden -- not this one's turn yet
      var dx = player.x - p.x, dy = player.y - p.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      // apple is a precision mid-air grab -- much more forgiving radius
      // than a pickup you're rolling/gliding straight over
      var magnetR = p.type === "apple" ? t.appleMagnetRadius : t.magnetRadius;
      var collectR = p.type === "apple" ? t.appleCollectRadius : t.collectRadius;
      var magnetPull = p.type === "apple" ? t.appleMagnetPull : t.magnetPull;
      if (dist < magnetR) {
        var pull = clamp(magnetPull * dt, 0, 1);
        p.x += dx * pull;
        p.y += dy * pull;
      }
      if (dist < collectR) this.collect(p);
    }
    // cull collected / far-behind pickups
    var cutoff = camera.x - W;
    this.list = this.list.filter(function (p) { return !p.collected && p.x > cutoff; });
  },

  collect: function (p) {
    p.collected = true;
    var t = TUNING.pickups;
    if (p.type === "coin") {
      game.addScore(t.coinScore);
      game.spawnPopup("+" + t.coinScore, p.x, p.y - 20, ASSETS.pickups.coin.color);
    } else if (p.type === "boost") {
      player.speed = Math.min(player.speed + t.boostAmount, TUNING.maxSpeed);
      var mag = Math.sqrt(player.vx * player.vx + player.vy * player.vy) || 1;
      var scale = player.speed / mag;
      player.vx *= scale;
      player.vy *= scale;
      game.addScore(t.boostScore);
      game.spawnPopup("BOOST!", p.x, p.y - 20, ASSETS.pickups.boost.color);
    } else if (p.type === "battery") {
      p.group.revealIndex++;
      if (p.group.revealIndex >= p.group.size) {
        game.startBatteryRecharge(TUNING.battery.refillPickup);
        game.spawnPopup("FULL CHARGE!", p.x, p.y - 24, ASSETS.pickups.battery.color);
        playChargeCompleteSound();
      } else {
        playBuzzSound(p.groupIndex);
      }
    } else if (p.type === "apple") {
      var curSpeed = Math.sqrt(player.vx * player.vx + player.vy * player.vy) || TUNING.minSpeed;
      var curAngle = Math.atan2(player.vy, player.vx);
      var launchAngle = curAngle - TUNING.apple.pitchUp;
      var launchSpeed = Math.min(curSpeed * TUNING.apple.speedMult, TUNING.maxSpeed);
      player.vx = launchSpeed * Math.cos(launchAngle);
      player.vy = launchSpeed * Math.sin(launchAngle);
      player.state = "AIRBORNE";
      player.startBackflip();
      game.addScore(t.appleScore);
      game.spawnPopup("BACKFLIP!", p.x, p.y - 24, ASSETS.pickups.apple.color);
      playAppleCrunchSound();
      playAppleBoostSound();
    }
  },

  draw: function (ctx) {
    for (var i = 0; i < this.list.length; i++) {
      var p = this.list[i];
      if (p.collected) continue;
      if (p.group && p.groupIndex !== p.group.revealIndex) continue; // stay hidden until it's revealed
      var s = worldToScreen(p.x, p.y);
      ASSETS.pickups[p.type].draw(ctx, s.x, s.y, p.t, p.small ? 0.65 : 1);
    }
  }
};

// ===========================================================================
// 6. Camera — follow + speed zoom
// ===========================================================================
var camera = {
  x: 0, y: 0, zoom: 1,
  shakeTime: 0, shakeDurationInitial: 0, shakeMagInitial: 0,
  shakeOffsetX: 0, shakeOffsetY: 0
};

function triggerCameraShake(magnitude, duration) {
  camera.shakeTime = duration;
  camera.shakeDurationInitial = duration;
  camera.shakeMagInitial = magnitude;
}

function worldToScreen(wx, wy) {
  return {
    x: (wx - camera.x) * camera.zoom + W * TUNING.camera.leadFraction + camera.shakeOffsetX,
    y: (wy - camera.y) * camera.zoom + H * 0.5 + camera.shakeOffsetY
  };
}

function updateCamera(dt) {
  var c = TUNING.camera;
  camera.x = easeTowards(camera.x, player.x, c.easeX, dt);

  // Only ever bias the view toward MORE GROUND, never toward more sky.
  // A signed lookahead (climb = look up) left the player blind on the way
  // up a jump, since there's nothing useful to see above -- what matters
  // is the landing zone ahead/below, whether still climbing or falling.
  var lookahead = clamp(player.vy * c.vertLookaheadTime, 0, c.vertLookaheadMax);
  var vEase = player.state === "AIRBORNE" ? c.easeYAirborne : c.easeY;
  camera.y = easeTowards(camera.y, player.y + lookahead, vEase, dt);

  // zoom out for speed AND for altitude -- being high above the terrain
  // needs visibility just as much as going fast does, and a dive that's
  // both fast and high should pull back further than either alone
  var speedRatio = clamp(player.speed / c.zoomSpeedRef, 0, 1);
  var altitude = Math.max(0, terrain.y(player.x) - player.y);
  var altRatio = clamp(altitude / c.zoomAltRef, 0, 1);
  var zoomRatio = clamp(speedRatio + altRatio, 0, 1);
  // any time in the air at all, guarantee at least a minimum pull-back so
  // the incoming ground is never out of frame, even on a modest hop
  if (player.state === "AIRBORNE") {
    zoomRatio = Math.max(zoomRatio, c.zoomAirborneMin);
  }
  var targetZoom = lerp(c.zoomMax, c.zoomMin, zoomRatio);
  camera.zoom = easeTowards(camera.zoom, targetZoom, c.easeZoom, dt);

  if (camera.shakeTime > 0) {
    camera.shakeTime = Math.max(0, camera.shakeTime - dt);
    var shakeRatio = camera.shakeTime / camera.shakeDurationInitial;
    var mag = camera.shakeMagInitial * shakeRatio;
    camera.shakeOffsetX = (Math.random() * 2 - 1) * mag;
    camera.shakeOffsetY = (Math.random() * 2 - 1) * mag;
  } else {
    camera.shakeOffsetX = 0;
    camera.shakeOffsetY = 0;
  }
}

// ===========================================================================
// speed streaks -- purely cosmetic "sense of speed" trail behind the player
// ===========================================================================
var speedStreaks = [];
function updateSpeedStreaks(dt) {
  var fx = TUNING.speedFx;
  var ratio = clamp((player.speed - fx.threshold) / (fx.maxRef - fx.threshold), 0, 1);
  if (ratio > 0 && Math.random() < ratio * fx.spawnChance) {
    speedStreaks.push({
      x: player.x - randRange(10, 40),
      y: player.y + randRange(-45, 45),
      len: lerp(fx.minLen, fx.maxLen, ratio) * randRange(0.7, 1.3),
      life: fx.lifeTime,
      maxLife: fx.lifeTime
    });
  }
  for (var i = speedStreaks.length - 1; i >= 0; i--) {
    speedStreaks[i].life -= dt;
    if (speedStreaks[i].life <= 0) speedStreaks.splice(i, 1);
  }
}
function drawSpeedStreaks() {
  for (var i = 0; i < speedStreaks.length; i++) {
    var p = speedStreaks[i];
    var s = worldToScreen(p.x, p.y);
    var alpha = clamp(p.life / p.maxLife, 0, 1) * 0.55;
    ctx.strokeStyle = "rgba(" + ASSETS.speedStreak.color + "," + alpha + ")";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - p.len * camera.zoom, s.y);
    ctx.stroke();
  }
}

// ===========================================================================
// confetti -- celebration burst played once Phil stops outside the house
// ===========================================================================
var confetti = [];
var CONFETTI_COLORS = ["#ff5d5d", "#ffd347", "#7ee8ff", "#7ec850", "#ff8a3d", "#ffffff"];
function spawnConfetti(x, y) {
  for (var i = 0; i < TUNING.finish.confettiCount; i++) {
    confetti.push({
      x: x + randRange(-30, 30),
      y: y - randRange(0, 40),
      vx: randRange(-160, 160),
      vy: randRange(-420, -180),
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      size: randRange(4, 8),
      rot: randRange(0, Math.PI * 2),
      spin: randRange(-8, 8),
      life: randRange(1.4, 2.2)
    });
  }
}
function updateConfetti(dt) {
  for (var i = confetti.length - 1; i >= 0; i--) {
    var c = confetti[i];
    c.vy += TUNING.gravity * 0.5 * dt;
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.rot += c.spin * dt;
    c.life -= dt;
    if (c.life <= 0) confetti.splice(i, 1);
  }
}
function drawConfetti() {
  for (var i = 0; i < confetti.length; i++) {
    var c = confetti[i];
    var s = worldToScreen(c.x, c.y);
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size * 0.6);
    ctx.restore();
  }
}

// ===========================================================================
// clouds (decorative parallax layer)
// ===========================================================================
var clouds = [];
function initClouds() {
  clouds = [];
  for (var i = 0; i < 8; i++) {
    clouds.push({
      x: randRange(0, 2000),
      y: randRange(40, 220),    // fixed screen-space Y -- never moves with camera/zoom
      scale: randRange(0.6, 1.2),
      parallax: randRange(0.02, 0.05)
    });
  }
}

// ===========================================================================
// 7. Renderer — sky, parallax hills, terrain, pickups, player, HUD
// ===========================================================================
function drawSky() {
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, ASSETS.sky.top);
  g.addColorStop(1, ASSETS.sky.bottom);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

var CLOUD_WRAP = 2000;
function drawClouds() {
  for (var i = 0; i < clouds.length; i++) {
    var c = clouds[i];
    var scroll = camera.x * c.parallax;
    var sx = ((c.x - scroll) % CLOUD_WRAP + CLOUD_WRAP) % CLOUD_WRAP - 150;
    ASSETS.clouds.draw(ctx, sx, c.y, c.scale);
  }
}

// A distant backdrop, drawn entirely in screen space -- deliberately NOT
// derived from world Y or camera.zoom (see ASSETS.backgroundHills), so a
// dive's zoom/altitude swings can never make it swell or jump around.
// Only a slow horizontal drift, like a painted-far-away hillside.
function drawBackgroundHills() {
  var layers = ASSETS.backgroundHills;
  for (var li = 0; li < layers.length; li++) {
    var layer = layers[li];
    ctx.fillStyle = layer.fill;
    ctx.beginPath();
    var baseY = H * layer.baseYFrac;
    var scroll = camera.x * layer.parallax;
    var first = true;
    for (var sx = -layer.wavelength; sx <= W + layer.wavelength; sx += 20) {
      var y = baseY + Math.sin((sx + scroll) / layer.wavelength * Math.PI * 2) * layer.amp;
      if (first) { ctx.moveTo(sx, y); first = false; } else ctx.lineTo(sx, y);
    }
    ctx.lineTo(W + layer.wavelength, H);
    ctx.lineTo(-layer.wavelength, H);
    ctx.closePath();
    ctx.fill();
  }
}

// Renders the terrain as a smooth, continuous filled curve -- terrain.y()
// is already a smooth cosine-interpolated function, so sampling it densely
// and connecting the samples directly (instead of quantizing each sample
// to a rounded block height) gives rolling hills back instead of a
// pixel-art staircase. Runs of the same hill (alternating fill/stripe by
// hillIndex, same as before) are batched into one filled polygon each --
// many small abutting shapes would otherwise leave faint antialiased
// seams between them.
function drawTerrain(targetCtx) {
  var kp = terrain.keyPoints;
  var palettes = ASSETS.terrain.sectionPalettes;
  var worldLeft = camera.x - 200 / camera.zoom;
  var worldRight = camera.x + (W + 200) / camera.zoom;
  var step = Math.max(4, 6 / camera.zoom); // world px per sample -- finer zoomed in, coarser out

  var startX = Math.floor(worldLeft / step) * step;
  var endX = Math.ceil(worldRight / step) * step;

  var runPoints = [];
  var runColor = null;
  var runOutline = null;
  function flushRun() {
    var n = runPoints.length;
    if (n < 2) { runPoints = []; return; }
    var bottomY = Math.max(runPoints[0].y, runPoints[n - 1].y) + 4000;
    var i;

    targetCtx.fillStyle = runColor;
    targetCtx.beginPath();
    targetCtx.moveTo(runPoints[0].x, runPoints[0].y);
    for (i = 1; i < n; i++) targetCtx.lineTo(runPoints[i].x, runPoints[i].y);
    targetCtx.lineTo(runPoints[n - 1].x, bottomY);
    targetCtx.lineTo(runPoints[0].x, bottomY);
    targetCtx.closePath();
    targetCtx.fill();

    targetCtx.strokeStyle = runOutline;
    targetCtx.lineWidth = 2;
    targetCtx.beginPath();
    targetCtx.moveTo(runPoints[0].x, runPoints[0].y);
    for (i = 1; i < n; i++) targetCtx.lineTo(runPoints[i].x, runPoints[i].y);
    targetCtx.stroke();

    runPoints = [];
  }

  for (var wx = startX; wx <= endX; wx += step) {
    var worldY = terrain.y(wx);
    var seg = kp[terrain.segmentIndexAt(wx)];
    var palette = palettes[Math.min(sectionIndexAtDistance(wx), palettes.length - 1)];
    var color = (seg.hillIndex % 2 === 0) ? palette.fill : palette.stripe;
    var pt = worldToScreen(wx, worldY);

    if (color !== runColor && runColor !== null) {
      // share this exact boundary point with the run that's ending, so its
      // fill reaches all the way to here instead of stopping one sample
      // short -- otherwise the gap between the two runs' polygons leaves a
      // hairline seam showing whatever's behind the terrain
      runPoints.push(pt);
      flushRun();
      runOutline = palette.outline;
    } else if (runColor === null) {
      runOutline = palette.outline;
    }
    runColor = color;
    runPoints.push(pt);
  }
  flushRun();
}

function drawPlayer() {
  // out of sight once he's ridden through the door -- he's inside the house
  if (game.state === "FINISHING" && game.finishPhase !== "approaching") return;
  var s = worldToScreen(player.x, player.y);
  var state, angle;
  if (player.bailTimer > 0) {
    state = "BAIL";
    angle = player.bailSpin; // uncontrolled tumble, overrides the normal slope/velocity angle
  } else {
    state = (player.state === "AIRBORNE" && player.diveHeld) ? "AIRBORNE_DIVE" : player.state;
    angle = player.angle;
    if (state === "GROUNDED" && player.wheelieActive) {
      angle -= TUNING.wheelie.tiltAngle; // nose-up pop, purely cosmetic
    }
    if (player.backflipTimer > 0) {
      // one full backward rotation layered on top of the normal angle --
      // purely a visual overlay, the real velocity-driven angle underneath
      // keeps landing detection unaffected by how the flip looks
      var flipProgress = 1 - player.backflipTimer / player.backflipDuration;
      angle -= flipProgress * Math.PI * 2;
    }
  }
  ASSETS.player.draw(ctx, s.x, s.y, angle, state, player.speed);
}

// Floating running total of airtime score, hovering above Phil while
// he's in the air -- punches (scale + white flash + brighter glow) each
// time a new second of airtime ticks in, on top of the existing +N popup.
function drawAirtimeCounter() {
  if (player.state !== "AIRBORNE" || player.airTimeScore <= 0) return;
  var s = worldToScreen(player.x, player.y);
  var bob = Math.sin(performance.now() / 260) * 4;
  var pulseScale = 1 + 0.5 * player.airCounterPulse;
  var text = "+" + player.airTimeScore;

  ctx.save();
  ctx.translate(s.x, s.y - 74 + bob);
  ctx.scale(pulseScale, pulseScale);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "bold 26px sans-serif";
  ctx.shadowColor = ASSETS.hud.airtimeColor;
  ctx.shadowBlur = 10 + 16 * player.airCounterPulse;
  ctx.fillStyle = ASSETS.hud.airtimeColor;
  ctx.fillText(text, 0, 0);
  if (player.airCounterPulse > 0) {
    ctx.globalAlpha = player.airCounterPulse;
    ctx.fillStyle = "#ffffff";
    ctx.fillText(text, 0, 0);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// Brief resolution flash right where Phil lands, showing what happened to
// the flight's banked airtime bonus: doubled (perfect downslope landing),
// crossed out and lost (a bail), or paid out as-is (an ordinary landing).
function drawAirResolve() {
  var r = game.airResolve;
  if (!r) return;
  var age = r.maxLife - r.life;
  var alpha = clamp(r.life / (r.maxLife * 0.4), 0, 1);
  var popT = clamp(age / 0.16, 0, 1);
  var scale = 0.5 + 0.7 * popT;
  if (popT >= 1) scale = 1 + 0.15 * (1 - clamp((age - 0.16) / 0.3, 0, 1));
  var floatY = -110 - age * 36;
  var s = worldToScreen(r.x, r.y);

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(s.x, s.y + floatY);
  ctx.scale(scale, scale);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  if (r.type === "lost") {
    ctx.font = "bold 28px sans-serif";
    ctx.fillStyle = ASSETS.hud.bailColor;
    ctx.shadowColor = ASSETS.hud.bailColor;
    ctx.shadowBlur = 10;
    var lostText = "+" + r.amount;
    ctx.fillText(lostText, 0, 0);
    var lw = ctx.measureText(lostText).width;
    ctx.strokeStyle = ASSETS.hud.bailColor;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-lw / 2 - 6, 0);
    ctx.lineTo(lw / 2 + 6, 0);
    ctx.stroke();
  } else if (r.type === "double") {
    ctx.font = "bold 30px sans-serif";
    ctx.fillStyle = ASSETS.hud.doubleColor;
    ctx.shadowColor = ASSETS.hud.doubleColor;
    ctx.shadowBlur = 18;
    ctx.fillText("+" + r.awarded + "!", 0, 0);
    ctx.font = "bold 14px sans-serif";
    ctx.fillText("PERFECT x2 AIR BONUS", 0, 22);
  } else {
    ctx.font = "bold 26px sans-serif";
    ctx.fillStyle = ASSETS.hud.airtimeColor;
    ctx.shadowColor = ASSETS.hud.airtimeColor;
    ctx.shadowBlur = 10;
    ctx.fillText("+" + r.awarded, 0, 0);
  }

  ctx.restore();
}

function drawHouse() {
  var groundY = terrain.y(JOURNEY_TOTAL_DISTANCE);
  var s = worldToScreen(JOURNEY_TOTAL_DISTANCE, groundY);
  ASSETS.house.draw(ctx, s.x, s.y, performance.now() / 1000);
}

// A simple figure -- head and two arms thrown up -- bouncing in the
// window with a warm glow behind it, once Phil's ridden inside and the
// celebration phase kicks in.
function drawWindowCelebration() {
  if (game.state !== "FINISHING" || game.finishPhase !== "celebrating") return;
  var wx = JOURNEY_TOTAL_DISTANCE + ASSETS.house.width * 0.08 + 23;
  var wy = terrain.y(JOURNEY_TOTAL_DISTANCE) - ASSETS.house.height + 39;
  var s = worldToScreen(wx, wy);
  var t = performance.now() / 1000;

  ctx.save();
  var glowPulse = 0.5 + 0.5 * Math.sin(t * 4);
  ctx.fillStyle = "rgba(255,230,150," + (0.35 + 0.25 * glowPulse) + ")";
  ctx.beginPath();
  ctx.arc(s.x, s.y, 22, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  var bounce = Math.abs(Math.sin(t * 5)) * 7;
  ctx.save();
  ctx.translate(s.x, s.y - bounce);
  ctx.fillStyle = "#f2c49b";
  ctx.beginPath();
  ctx.arc(0, 1, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#2f6fd6";
  ctx.lineWidth = 4;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(-5, 6);
  ctx.lineTo(-11, -4);
  ctx.moveTo(5, 6);
  ctx.lineTo(11, -4);
  ctx.stroke();
  ctx.restore();
}

function render() {
  drawSky();
  drawClouds();
  drawBackgroundHills();
  drawTerrain(ctx);
  drawHouse();
  drawWindowCelebration();
  pickups.draw(ctx);
  drawSpeedStreaks();
  drawPlayer();
  drawAirtimeCounter();
  drawAirResolve();
  drawConfetti();
  drawHUD();
}

// ===========================================================================
// 8. HUD — score, combo, speed, battery bar, mission timer, section
//    banners, PERFECT popups, title/gameover/win
// ===========================================================================
function formatTime(seconds) {
  seconds = Math.max(0, seconds);
  var m = Math.floor(seconds / 60);
  var s = Math.floor(seconds % 60);
  return m + ":" + (s < 10 ? "0" : "") + s;
}

// ---------------------------------------------------------------------------
// high score -- persisted locally so it survives a page reload
// ---------------------------------------------------------------------------
var HIGH_SCORE_KEY = "downhillPhilHighScore";
function getHighScore() {
  var v = 0;
  try { v = parseInt(localStorage.getItem(HIGH_SCORE_KEY), 10); } catch (e) {}
  return isNaN(v) ? 0 : v;
}
function saveHighScoreIfBetter(score) {
  var best = getHighScore();
  if (score > best) {
    try { localStorage.setItem(HIGH_SCORE_KEY, String(score)); } catch (e) {}
    return true;
  }
  return false;
}

function drawHUD() {
  var hud = ASSETS.hud;
  ctx.save();
  ctx.textBaseline = "top";

  // top-left status panel: score, combo, speed, section
  ctx.fillStyle = hud.panelBg;
  roundRect(ctx, 6, 6, 226, 108, 14);
  ctx.fill();
  ctx.strokeStyle = hud.panelBorder;
  ctx.lineWidth = 1;
  roundRect(ctx, 6, 6, 226, 108, 14);
  ctx.stroke();

  ctx.shadowColor = hud.shadow;
  ctx.shadowBlur = 4;

  // score -- punches up briefly on each airtime tick for a satisfying feel
  ctx.fillStyle = hud.text;
  ctx.font = "bold 26px sans-serif";
  var scorePulseScale = 1 + 0.35 * game.scorePulse;
  ctx.save();
  ctx.translate(16, 14);
  ctx.scale(scorePulseScale, scorePulseScale);
  ctx.fillText("Score: " + game.score, 0, 0);
  ctx.restore();

  // combo
  if (player.combo > 1) {
    ctx.fillStyle = hud.comboColor;
    ctx.font = "bold 20px sans-serif";
    ctx.fillText("Combo x" + player.combo, 16, 46);
  }

  // speed readout
  ctx.fillStyle = hud.speedColor;
  ctx.font = "16px sans-serif";
  ctx.fillText(Math.round(player.speed) + " px/s", 16, 74);

  // current section name, small persistent label
  var sectionName = TUNING.journey.sections[game.sectionIndex] ? TUNING.journey.sections[game.sectionIndex].name : "";
  ctx.fillStyle = hud.sectionColor;
  ctx.font = "bold 14px sans-serif";
  ctx.fillText(sectionName, 16, 96);

  // top-right panel: battery bar (with bolt icon) + mission timer
  var barW = Math.min(220, W * 0.36), barH = 16;
  var barX = W - barW - 34, barY = 20;
  var panelX = barX - 14, panelW = barW + 48;
  ctx.shadowBlur = 0;
  ctx.fillStyle = hud.panelBg;
  roundRect(ctx, panelX, 6, panelW, 68, 14);
  ctx.fill();
  ctx.strokeStyle = hud.panelBorder;
  roundRect(ctx, panelX, 6, panelW, 68, 14);
  ctx.stroke();

  // bolt icon to the left of the battery bar
  ctx.save();
  ctx.translate(barX - 10, barY + barH / 2);
  ctx.fillStyle = game.battery / TUNING.battery.max < 0.2 ? hud.batteryBarLow : hud.batteryBarFill;
  ctx.beginPath();
  ctx.moveTo(2, -8);
  ctx.lineTo(-6, 1);
  ctx.lineTo(-1, 1);
  ctx.lineTo(-2, 8);
  ctx.lineTo(6, -1);
  ctx.lineTo(1, -1);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = hud.batteryBarBg;
  roundRect(ctx, barX, barY, barW, barH, 8);
  ctx.fill();
  var frac = clamp(game.battery / TUNING.battery.max, 0, 1);
  var battGrad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
  if (frac < 0.2) {
    battGrad.addColorStop(0, hud.batteryBarLow);
    battGrad.addColorStop(1, hud.batteryBarLow);
  } else {
    battGrad.addColorStop(0, hud.batteryBarFillAlt);
    battGrad.addColorStop(1, hud.batteryBarFill);
  }
  ctx.fillStyle = battGrad;
  roundRect(ctx, barX, barY, barW * frac, barH, 8);
  ctx.fill();

  // mission timer, under the battery bar
  ctx.shadowColor = hud.shadow;
  ctx.shadowBlur = 4;
  ctx.textAlign = "right";
  ctx.font = "bold 18px sans-serif";
  ctx.fillStyle = game.missionTimer < 15 ? hud.timeLowColor : hud.text;
  ctx.fillText(formatTime(game.missionTimer), barX + barW, barY + barH + 8);
  ctx.textAlign = "left";

  // popups
  ctx.font = "bold 22px sans-serif";
  ctx.textAlign = "center";
  for (var i = 0; i < game.popups.length; i++) {
    var p = game.popups[i];
    var s = worldToScreen(p.x, p.y - (1 - p.life / p.maxLife) * 60);
    ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, s.x, s.y);
  }
  ctx.globalAlpha = 1;

  // section banner -- a big centered "road sign" reveal, screen-anchored
  if (game.sectionBanner) {
    var b = game.sectionBanner;
    var fadeIn = clamp((b.maxLife - b.life) / 0.3, 0, 1);
    var fadeOut = clamp(b.life / 0.5, 0, 1);
    ctx.globalAlpha = Math.min(fadeIn, fadeOut);
    var bannerGrad = ctx.createLinearGradient(0, H * 0.3, 0, H * 0.3 + 90);
    bannerGrad.addColorStop(0, hud.bannerBg1);
    bannerGrad.addColorStop(1, hud.bannerBg2);
    ctx.fillStyle = bannerGrad;
    ctx.fillRect(0, H * 0.3, W, 90);
    ctx.fillStyle = hud.bannerBorder;
    ctx.fillRect(0, H * 0.3, W, 2);
    ctx.fillRect(0, H * 0.3 + 88, W, 2);
    ctx.shadowColor = "rgba(255,61,166,0.8)";
    ctx.shadowBlur = 18;
    ctx.fillStyle = hud.text;
    ctx.font = "bold 40px sans-serif";
    ctx.fillText(b.text, W / 2, H * 0.3 + 20);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = "left";

  if (game.state === "TITLE") drawTitleScreen();
  else if (game.state === "GAMEOVER") drawGameOverScreen();
  else if (game.state === "WIN") drawWinScreen();

  // drawn last so it always sits on top of the title/game-over/win overlays too
  drawMuteButton();

  ctx.restore();
}

// Global sound toggle -- gates any sound effects (e.g. the airtime tick)
var soundMuted = false;

// Lazily-created AudioContext for tiny synthesized sound effects (no audio
// file needed). Created/resumed from game.start(), which itself only ever
// runs inside a pointerdown/keydown handler, so this satisfies the
// browser's autoplay-requires-a-user-gesture rule.
var audioCtx = null;
function ensureAudioCtx() {
  if (!audioCtx) {
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    audioCtx = new Ctor();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

// A short, bright blip whose pitch climbs with `index` (the flight's tick
// count so far) -- an ascending scale is what makes a rapid-fire counter
// feel satisfying rather than just noisy.
function playTickSound(index) {
  if (soundMuted) return;
  var ctx2 = ensureAudioCtx();
  if (!ctx2) return;
  var a = TUNING.airtime;
  var freq = Math.min(a.tickPitchStart + index * a.tickPitchStep, a.tickPitchMax);
  var now = ctx2.currentTime;
  var osc = ctx2.createOscillator();
  var gain = ctx2.createGain();
  osc.type = "square";
  osc.frequency.setValueAtTime(freq, now);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.16, now + 0.004);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.075);
  osc.connect(gain);
  gain.connect(ctx2.destination);
  osc.start(now);
  osc.stop(now + 0.08);
}

// A little "cha-ching" -- two quick ascending bell notes -- played right
// as a landing locks the airtime bonus into the real score (banked or
// doubled). Not played on a bail/lost bonus, since nothing was gained.
function playChaChingSound() {
  if (soundMuted) return;
  var ctx2 = ensureAudioCtx();
  if (!ctx2) return;
  var now = ctx2.currentTime;
  var notes = [1046.5, 1318.5]; // C6 then E6
  for (var i = 0; i < notes.length; i++) {
    var t0 = now + i * 0.07;
    var osc = ctx2.createOscillator();
    var gain = ctx2.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(notes[i], t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.22, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
    osc.connect(gain);
    gain.connect(ctx2.destination);
    osc.start(t0);
    osc.stop(t0 + 0.24);
  }
}

// Short electric "zzt" for collecting one battery in a row -- a wobbling
// sawtooth rather than a clean tone, so it reads as "charge" rather than
// "score". Pitch nudges up with index so a row builds a little excitement.
function playBuzzSound(index) {
  if (soundMuted) return;
  var ctx2 = ensureAudioCtx();
  if (!ctx2) return;
  var now = ctx2.currentTime;
  var baseFreq = 180 + index * 25;
  var osc = ctx2.createOscillator();
  var gain = ctx2.createGain();
  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(baseFreq, now);
  osc.frequency.linearRampToValueAtTime(baseFreq * 1.4, now + 0.03);
  osc.frequency.linearRampToValueAtTime(baseFreq, now + 0.06);
  osc.frequency.linearRampToValueAtTime(baseFreq * 1.4, now + 0.09);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.14, now + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
  osc.connect(gain);
  gain.connect(ctx2.destination);
  osc.start(now);
  osc.stop(now + 0.14);
}

// A fuller rising sweep played once the whole row is collected and the
// battery actually starts recharging.
function playChargeCompleteSound() {
  if (soundMuted) return;
  var ctx2 = ensureAudioCtx();
  if (!ctx2) return;
  var now = ctx2.currentTime;
  var osc = ctx2.createOscillator();
  var gain = ctx2.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(300, now);
  osc.frequency.exponentialRampToValueAtTime(900, now + 0.28);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.25, now + 0.03);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);
  osc.connect(gain);
  gain.connect(ctx2.destination);
  osc.start(now);
  osc.stop(now + 0.34);
}

// Apple pickup: two quick bursts of filtered, decaying noise -- a crunchy
// "bite" texture that a pure-oscillator tone can't produce. Plays right
// at the moment of collection, just ahead of the launch whoosh/chime
// below, so it reads as "bite the apple, THEN get launched" rather than
// one blended cue.
function playAppleCrunchSound() {
  if (soundMuted) return;
  var ctx2 = ensureAudioCtx();
  if (!ctx2) return;
  var now = ctx2.currentTime;

  var bites = [0, 0.1];
  for (var b = 0; b < bites.length; b++) {
    var t0 = now + bites[b];
    var duration = 0.09;
    var bufferSize = Math.max(1, Math.floor(ctx2.sampleRate * duration));
    var buffer = ctx2.createBuffer(1, bufferSize, ctx2.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) {
      // decaying white noise -- the raw "crunch" texture
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
    }
    var noise = ctx2.createBufferSource();
    noise.buffer = buffer;

    var filter = ctx2.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = 1100 + b * 400; // second bite pitched a bit higher/crisper
    filter.Q.value = 0.8;

    var gain = ctx2.createGain();
    gain.gain.setValueAtTime(0.001, t0);
    gain.gain.exponentialRampToValueAtTime(0.5, t0 + 0.006);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ctx2.destination);
    noise.start(t0);
    noise.stop(t0 + duration + 0.01);
  }
}

// Apple pickup: a rising sawtooth "whoosh" for the launch, immediately
// followed by a bright ascending three-note chime -- reads as a bigger,
// more magical event than the other pickups' single-tone cues.
function playAppleBoostSound() {
  if (soundMuted) return;
  var ctx2 = ensureAudioCtx();
  if (!ctx2) return;
  var now = ctx2.currentTime;

  var whoosh = ctx2.createOscillator();
  var whooshGain = ctx2.createGain();
  whoosh.type = "sawtooth";
  whoosh.frequency.setValueAtTime(180, now);
  whoosh.frequency.exponentialRampToValueAtTime(720, now + 0.22);
  whooshGain.gain.setValueAtTime(0.0001, now);
  whooshGain.gain.exponentialRampToValueAtTime(0.14, now + 0.05);
  whooshGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.24);
  whoosh.connect(whooshGain);
  whooshGain.connect(ctx2.destination);
  whoosh.start(now);
  whoosh.stop(now + 0.26);

  var notes = [784, 987.8, 1318.5]; // G5, B5, E6
  for (var i = 0; i < notes.length; i++) {
    var t0 = now + 0.16 + i * 0.075;
    var osc = ctx2.createOscillator();
    var gain = ctx2.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(notes[i], t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.24, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.26);
    osc.connect(gain);
    gain.connect(ctx2.destination);
    osc.start(t0);
    osc.stop(t0 + 0.28);
  }
}

// Bottom-left corner -- always clear of the score/battery HUD panels in
// every game state, so it never has to push other UI around.
var MUTE_BTN = { cx: 30, r: 17 };
function muteButtonY() { return H - 30; }
function isMuteButtonHit(x, y) {
  var dx = x - MUTE_BTN.cx, dy = y - muteButtonY();
  return dx * dx + dy * dy <= MUTE_BTN.r * MUTE_BTN.r;
}
function drawMuteButton() {
  var b = { cx: MUTE_BTN.cx, cy: muteButtonY(), r: MUTE_BTN.r };
  ctx.save();
  ctx.fillStyle = "rgba(20,10,40,0.55)";
  ctx.beginPath();
  ctx.arc(b.cx, b.cy, b.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.translate(b.cx, b.cy);
  ctx.fillStyle = "#ffffff";
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 2;
  ctx.lineJoin = "round";

  // speaker body + cone
  ctx.beginPath();
  ctx.moveTo(-8, -4);
  ctx.lineTo(-3, -4);
  ctx.lineTo(3, -9);
  ctx.lineTo(3, 9);
  ctx.lineTo(-3, 4);
  ctx.lineTo(-8, 4);
  ctx.closePath();
  ctx.fill();

  if (soundMuted) {
    ctx.beginPath();
    ctx.moveTo(-9, -9);
    ctx.lineTo(9, 9);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.arc(2, 0, 6, -0.6, 0.6);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(2, 0, 10, -0.7, 0.7);
    ctx.stroke();
  }
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  w = Math.max(w, 0);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawTitleScreen() {
  var t = ASSETS.title;
  var now = performance.now();

  // full-bleed synthwave sunset sky
  var sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, t.skyTop);
  sky.addColorStop(0.55, t.skyMid);
  sky.addColorStop(1, t.skyLow);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  var horizonY = H * 0.64;
  var sunCx = W / 2, sunCy = horizonY - Math.min(W, H) * 0.06;
  var sunR = Math.min(W, H) * 0.26;

  // slow-rotating light rays fanning out from behind the sun
  ctx.save();
  ctx.translate(sunCx, sunCy);
  ctx.rotate(now / 30000);
  var rayCount = 14;
  for (var i = 0; i < rayCount; i++) {
    ctx.save();
    ctx.rotate((i / rayCount) * Math.PI * 2);
    ctx.fillStyle = t.rayColor;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, sunR * 3, -0.045, 0.045);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // striped retro sun, clipped so it never pokes below the horizon
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, W, horizonY);
  ctx.clip();
  var sunGrad = ctx.createLinearGradient(0, sunCy - sunR, 0, sunCy + sunR);
  sunGrad.addColorStop(0, t.sunTop);
  sunGrad.addColorStop(1, t.sunBottom);
  ctx.fillStyle = sunGrad;
  ctx.beginPath();
  ctx.arc(sunCx, sunCy, sunR, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = t.skyMid; // cut horizontal gaps into the sun, poster-style
  ctx.globalAlpha = 0.85;
  for (var j = 0; j < 5; j++) {
    var stripeY = sunCy + sunR * (0.12 + j * 0.15);
    ctx.fillRect(sunCx - sunR, stripeY, sunR * 2, sunR * 0.05);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // ground plane + perspective grid receding to the horizon
  ctx.fillStyle = t.groundColor;
  ctx.fillRect(0, horizonY, W, H - horizonY);
  ctx.strokeStyle = t.gridColor;
  ctx.lineWidth = 1.5;
  var vanishX = W / 2;
  for (var gx = -9; gx <= 9; gx++) {
    ctx.beginPath();
    ctx.moveTo(vanishX, horizonY);
    ctx.lineTo(vanishX + gx * W * 0.65, H);
    ctx.stroke();
  }
  for (var gy = 1; gy <= 7; gy++) {
    var frac = gy / 7;
    var ly = horizonY + (H - horizonY) * (frac * frac);
    ctx.beginPath();
    ctx.moveTo(0, ly);
    ctx.lineTo(W, ly);
    ctx.stroke();
  }

  // title -- chrome/neon gradient fill over a glowing magenta outline,
  // with a gentle breathing pulse
  var pulse = 1 + 0.025 * Math.sin(now / 450);
  var titleSize = clamp(W * 0.11, 30, 80);
  var titleY = H * 0.13;
  ctx.save();
  ctx.translate(W / 2, titleY);
  ctx.scale(pulse, pulse);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "900 " + titleSize + "px sans-serif";
  var titleGrad = ctx.createLinearGradient(0, -titleSize * 0.6, 0, titleSize * 0.6);
  titleGrad.addColorStop(0, t.titleGradTop);
  titleGrad.addColorStop(1, t.titleGradBottom);
  ctx.shadowColor = t.titleStroke;
  ctx.shadowBlur = titleSize * 0.35;
  ctx.lineWidth = titleSize * 0.05;
  ctx.strokeStyle = t.titleStroke;
  ctx.strokeText("DOWNHILL PHIL", 0, 0);
  ctx.fillStyle = titleGrad;
  ctx.fillText("DOWNHILL PHIL", 0, 0);
  ctx.restore();

  ctx.shadowBlur = 0;
  ctx.textAlign = "center";
  ctx.fillStyle = t.tagline;
  ctx.font = "bold " + clamp(W * 0.024, 13, 20) + "px sans-serif";
  var taglineY = titleY + titleSize * 0.62 + 18;
  ctx.fillText("RACE THE BATTERY. BEAT THE CLOCK. GET HOME.", W / 2, taglineY);

  ctx.fillStyle = t.routeColor;
  ctx.font = "bold " + clamp(W * 0.017, 11, 15) + "px sans-serif";
  var routeY = taglineY + 26;
  ctx.fillText("GATESHEAD  →  WASHINGTON  →  SUNDERLAND", W / 2, routeY);

  // high score, if one exists yet
  var best = getHighScore();
  var afterHeaderY = routeY + 24;
  if (best > 0) {
    ctx.fillStyle = t.hintColor;
    ctx.font = "bold " + clamp(W * 0.019, 13, 17) + "px sans-serif";
    ctx.fillText("HIGH SCORE: " + best, W / 2, afterHeaderY);
    afterHeaderY += 26;
  }

  // hero photo -- the actual reference art, cropped from Phil's front tyre
  // up through his body and head, framed like an inset poster panel
  var heroBottom = afterHeaderY + 10;
  if (philHeroImg.complete && philHeroImg.naturalWidth > 0) {
    var heroAspect = philHeroImg.naturalHeight / philHeroImg.naturalWidth;
    var heroH = clamp(Math.min(W, H) * 0.34, 140, 280);
    var heroW = heroH / heroAspect;
    var heroX = W / 2 - heroW / 2;
    var heroY = heroBottom;

    ctx.save();
    ctx.shadowColor = t.titleStroke;
    ctx.shadowBlur = 22;
    roundRect(ctx, heroX, heroY, heroW, heroH, 18);
    ctx.fill(); // establishes the shadow, actual fill invisible behind the clipped image
    ctx.clip();
    ctx.shadowBlur = 0;
    ctx.drawImage(philHeroImg, heroX, heroY, heroW, heroH);
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = t.titleStroke;
    ctx.lineWidth = 3;
    roundRect(ctx, heroX, heroY, heroW, heroH, 18);
    ctx.stroke();
    ctx.restore();

    heroBottom = heroY + heroH;
  }

  // instructions -- shown once, right on the menu, before the first ride
  ctx.textAlign = "center";
  ctx.fillStyle = t.hintColor;
  ctx.font = "bold " + clamp(W * 0.022, 14, 19) + "px sans-serif";
  ctx.fillText("Touch the screen to go.", W / 2, heroBottom + 32);
  ctx.fillText("Get Phil home without losing charge..", W / 2, heroBottom + 58);

  // pulsing start button
  var btnPulse = 1 + 0.07 * Math.sin(now / 300);
  var btnW = clamp(W * 0.34, 220, 340), btnH = 62;
  var btnY = Math.max(heroBottom + 118, H * 0.88 - btnH / 2);
  ctx.save();
  ctx.translate(W / 2, btnY);
  ctx.scale(btnPulse, btnPulse);
  ctx.shadowColor = t.buttonBg;
  ctx.shadowBlur = 28;
  var btnGrad = ctx.createLinearGradient(-btnW / 2, 0, btnW / 2, 0);
  btnGrad.addColorStop(0, t.buttonBg);
  btnGrad.addColorStop(1, t.buttonBgAlt);
  ctx.fillStyle = btnGrad;
  roundRect(ctx, -btnW / 2, -btnH / 2, btnW, btnH, btnH / 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = t.buttonText;
  ctx.font = "bold 24px sans-serif";
  ctx.fillText("TAP TO START", 0, 2);
  ctx.restore();

  ctx.fillStyle = t.hintColor;
  ctx.font = "15px sans-serif";
  ctx.fillText("or press space", W / 2, btnY + btnH * 0.5 + 26);

  ctx.textAlign = "left";
  ctx.shadowBlur = 0;
}

// Eases the end-screen score up from 0 to its final value over ~1.1s so it
// reads as a satisfying tally rather than an instant number; the high
// score line waits for the tally to land before revealing itself.
var SCORE_TALLY_DURATION = 1.1;
function tallyDisplayScore() {
  var t = clamp(game.scoreRevealTimer / SCORE_TALLY_DURATION, 0, 1);
  var eased = 1 - Math.pow(1 - t, 3);
  return { value: Math.round(eased * game.score), done: t >= 1 };
}

function drawGameOverScreen() {
  var tally = tallyDisplayScore();
  if (game.failReason === "BATTERY") {
    drawBatteryDiedScreen(tally);
  } else {
    drawTimeOutScreen(tally);
  }
}

// Battery death gets the full dramatic poster treatment: a near-black
// backdrop with a soft spotlight cone, a distressed-looking title, and the
// reference art of Phil slumped beside his fallen bike (its own baked-in
// title/score text cropped away so our dynamic score can sit under it).
function drawBatteryDiedScreen(tally) {
  ctx.fillStyle = "#0a0a0c";
  ctx.fillRect(0, 0, W, H);
  var spot = ctx.createRadialGradient(W / 2, 0, 0, W / 2, 0, Math.max(W, H) * 0.75);
  spot.addColorStop(0, "rgba(255,255,255,0.18)");
  spot.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = spot;
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  var titleSize = clamp(W * 0.11, 32, 74);
  var titleY = H * 0.13;
  ctx.save();
  ctx.translate(W / 2, titleY);
  ctx.font = "900 " + titleSize + "px sans-serif";
  ctx.shadowColor = "rgba(0,0,0,0.85)";
  ctx.shadowBlur = 14;
  ctx.lineWidth = titleSize * 0.09;
  ctx.strokeStyle = "#000000";
  ctx.strokeText("BATTERY DIED", 0, 0);
  var titleGrad = ctx.createLinearGradient(0, -titleSize * 0.5, 0, titleSize * 0.5);
  titleGrad.addColorStop(0, "#ffffff");
  titleGrad.addColorStop(1, "#9a9a9a");
  ctx.fillStyle = titleGrad;
  ctx.fillText("BATTERY DIED", 0, 0);
  ctx.restore();

  var heroBottom = titleY + titleSize * 0.62 + 20;
  if (philGameoverImg.complete && philGameoverImg.naturalWidth > 0) {
    var aspect = philGameoverImg.naturalHeight / philGameoverImg.naturalWidth;
    var heroH = clamp(Math.min(W, H) * 0.42, 160, 340);
    var heroW = heroH / aspect;
    var heroX = W / 2 - heroW / 2;
    var heroY = heroBottom;
    ctx.drawImage(philGameoverImg, heroX, heroY, heroW, heroH);
    heroBottom = heroY + heroH;
  }

  ctx.shadowBlur = 0;
  ctx.font = "bold 32px sans-serif";
  ctx.fillStyle = "#ffffff";
  ctx.fillText("Score: " + tally.value, W / 2, heroBottom + 38);

  if (tally.done) {
    ctx.globalAlpha = clamp((game.scoreRevealTimer - SCORE_TALLY_DURATION) / 0.3, 0, 1);
    ctx.font = "bold 18px sans-serif";
    ctx.fillStyle = game.isNewHighScore ? ASSETS.title.tagline : "rgba(255,255,255,0.7)";
    ctx.fillText(game.isNewHighScore ? "NEW HIGH SCORE!" : "Best: " + getHighScore(), W / 2, heroBottom + 72);
    ctx.globalAlpha = 1;
  }

  ctx.font = "22px sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.fillText("tap to try again", W / 2, heroBottom + 110);

  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
}

function drawTimeOutScreen(tally) {
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = ASSETS.hud.titleColor;
  ctx.font = "bold 44px sans-serif";
  ctx.fillText("Ran out of time", W / 2, H / 2 - 70);
  ctx.font = "bold 32px sans-serif";
  ctx.fillText("Score: " + tally.value, W / 2, H / 2 - 10);
  if (tally.done) {
    ctx.globalAlpha = clamp((game.scoreRevealTimer - SCORE_TALLY_DURATION) / 0.3, 0, 1);
    ctx.font = "bold 18px sans-serif";
    ctx.fillStyle = game.isNewHighScore ? ASSETS.title.tagline : "rgba(255,255,255,0.75)";
    ctx.fillText(game.isNewHighScore ? "NEW HIGH SCORE!" : "Best: " + getHighScore(), W / 2, H / 2 + 24);
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = ASSETS.hud.titleColor;
  ctx.font = "22px sans-serif";
  ctx.fillText("tap to try again", W / 2, H / 2 + 62);
  ctx.textAlign = "left";
}

function drawWinScreen() {
  var tally = tallyDisplayScore();
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = ASSETS.hud.titleColor;
  ctx.font = "bold 44px sans-serif";
  ctx.fillText("You made it home!", W / 2, H / 2 - 90);
  ctx.font = "bold 32px sans-serif";
  ctx.fillText("Score: " + tally.value, W / 2, H / 2 - 30);
  if (tally.done) {
    ctx.globalAlpha = clamp((game.scoreRevealTimer - SCORE_TALLY_DURATION) / 0.3, 0, 1);
    ctx.font = "bold 18px sans-serif";
    ctx.fillStyle = game.isNewHighScore ? ASSETS.title.tagline : "rgba(255,255,255,0.75)";
    ctx.fillText(game.isNewHighScore ? "NEW HIGH SCORE!" : "Best: " + getHighScore(), W / 2, H / 2 - 4);
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = ASSETS.hud.titleColor;
  ctx.font = "22px sans-serif";
  ctx.fillText("Time left: " + formatTime(game.missionTimer), W / 2, H / 2 + 30);
  ctx.fillText("tap to ride again", W / 2, H / 2 + 66);
  ctx.textAlign = "left";
}

// ===========================================================================
// 9. Game — TITLE -> PLAYING -> GAMEOVER, fixed timestep loop, input, resize
// ===========================================================================
var game = {
  state: "TITLE", // TITLE | PLAYING | FINISHING | GAMEOVER | WIN
  score: 0,
  battery: TUNING.battery.max,
  missionTimer: TUNING.mission.timeLimit,
  sectionIndex: 0,
  failReason: "", // "BATTERY" | "TIME" -- which fail condition ended the run
  popups: [],
  sectionBanner: null, // {text, life, maxLife} -- one big centered "road sign" at a time
  gameOverCooldown: 0,
  scorePulse: 0, // 0-1, decaying "punch" applied to the HUD score text on each airtime tick
  finishPhase: "approaching", // FINISHING sub-phase: "approaching" (riding to the door) ->
                              // "hidden" (inside, out of sight) -> "celebrating" (in the window)
  finishTimer: 0,             // s elapsed in the current finishPhase
  isNewHighScore: false,
  airResolve: null, // {type, amount, awarded, x, y, life, maxLife} -- brief "doubled/lost/banked" flash right after a landing
  scoreRevealTimer: 0, // s since GAMEOVER/WIN began -- drives the score tally-up on the end screen
  batteryRechargeTarget: TUNING.battery.max, // battery eases up to this instead of snapping, for a satisfying fill

  start: function () {
    terrain.init();
    terrain.ensureGenerated(4000);
    pickups.reset();
    player.reset();
    camera.x = player.x;
    camera.y = player.y;
    camera.zoom = TUNING.camera.zoomMax;
    initClouds();
    speedStreaks = [];
    confetti = [];
    this.score = 0;
    this.battery = TUNING.battery.max;
    this.batteryRechargeTarget = TUNING.battery.max;
    this.missionTimer = TUNING.mission.timeLimit;
    this.sectionIndex = 0;
    this.failReason = "";
    this.popups = [];
    this.scorePulse = 0;
    this.finishPhase = "approaching";
    this.finishTimer = 0;
    this.isNewHighScore = false;
    this.airResolve = null;
    this.scoreRevealTimer = 0;
    this.state = "PLAYING";
    this.showSectionBanner(TUNING.journey.sections[0].name);
    ensureAudioCtx();
  },

  addScore: function (n) { this.score += n; },

  startBatteryRecharge: function (amount) {
    this.batteryRechargeTarget = Math.min(TUNING.battery.max, this.battery + amount);
  },

  spawnPopup: function (text, x, y, color) {
    this.popups.push({ text: text, x: x, y: y, life: 1.0, maxLife: 1.0, color: color });
  },

  showSectionBanner: function (text) {
    this.sectionBanner = { text: text, life: 2.5, maxLife: 2.5 };
  },

  onAirtimeTick: function () {
    // Ticks bank into the flight's pending bonus (shown ticking above Phil's
    // head) rather than hitting the real score immediately -- the bonus is
    // only realized on landing, where it gets doubled, discarded, or paid
    // out in full depending on how the landing goes.
    player.airTimeScore += TUNING.airtime.scorePerTick;
    player.airCounterPulse = 1;
    playTickSound(player.airTicks - 1);
  },

  spawnAirResolve: function (type, amount, awarded, x, y) {
    this.airResolve = { type: type, amount: amount, awarded: awarded, x: x, y: y, life: TUNING.airtime.resolveDuration, maxLife: TUNING.airtime.resolveDuration };
  },

  update: function (dt) {
    if (this.state === "FINISHING") { this.updateFinishing(dt); return; }
    if (this.state !== "PLAYING") return;

    player.diveHeld = input.rightPressed;
    player.tiltHeld = input.leftPressed;
    player.update(dt);
    player.wheelieActive = player.state === "GROUNDED" && input.leftPressed;

    terrain.ensureGenerated(player.x + 4000);
    terrain.cull(camera.x - W * 2);

    pickups.update(dt);
    updateCamera(dt);
    updateSpeedStreaks(dt);

    // battery only drains while actively diving (right-side touch zone) --
    // coasting, and the cosmetic left-side wheelie, are both free
    if (input.rightPressed) {
      this.battery -= TUNING.battery.drainRate * dt;
      this.batteryRechargeTarget = Math.min(this.batteryRechargeTarget, this.battery);
    }
    // ease up toward a pending recharge target instead of snapping, so a
    // completed battery row visibly fills the meter rather than jumping
    if (this.battery < this.batteryRechargeTarget) {
      this.battery = Math.min(this.batteryRechargeTarget, this.battery + TUNING.battery.rechargeRate * dt);
    }
    if (this.battery <= 0) {
      this.battery = 0;
      this.state = "GAMEOVER";
      this.failReason = "BATTERY";
      this.gameOverCooldown = 0.5;
      this.scoreRevealTimer = 0;
      this.isNewHighScore = saveHighScoreIfBetter(this.score);
      this.sectionBanner = null; // don't let a fading banner clash with the end screen
      return;
    }

    this.missionTimer -= dt;
    if (this.missionTimer <= 0) {
      this.missionTimer = 0;
      this.state = "GAMEOVER";
      this.failReason = "TIME";
      this.gameOverCooldown = 0.5;
      this.scoreRevealTimer = 0;
      this.isNewHighScore = saveHighScoreIfBetter(this.score);
      this.sectionBanner = null;
      return;
    }

    var newSection = sectionIndexAtDistance(player.x);
    if (newSection !== this.sectionIndex) {
      this.sectionIndex = newSection;
      this.showSectionBanner(TUNING.journey.sections[newSection].name);
    }

    if (player.x >= JOURNEY_TOTAL_DISTANCE - TUNING.finish.decelDistance) {
      this.state = "FINISHING";
      this.finishPhase = "approaching";
      this.finishTimer = 0;
      this.sectionBanner = null;
      return;
    }

    for (var i = this.popups.length - 1; i >= 0; i--) {
      var p = this.popups[i];
      p.life -= dt / 0.9;
      if (p.life <= 0) this.popups.splice(i, 1);
    }

    if (this.sectionBanner) {
      this.sectionBanner.life -= dt;
      if (this.sectionBanner.life <= 0) this.sectionBanner = null;
    }

    if (this.scorePulse > 0) {
      this.scorePulse = Math.max(0, this.scorePulse - dt / TUNING.airtime.pulseDuration);
    }

    if (this.airResolve) {
      this.airResolve.life -= dt;
      if (this.airResolve.life <= 0) this.airResolve = null;
    }
  },

  // Scripted glide into the finish, entered once the player crosses into
  // the finish stretch -- input no longer drives the player here, so this
  // replaces the normal physics update for the remainder of the run.
  // Three beats: ride through the front door and disappear inside, a brief
  // pause out of sight, then pop up celebrating in the window before
  // finally flipping to the WIN screen.
  updateFinishing: function (dt) {
    terrain.ensureGenerated(player.x + 2000);
    terrain.cull(camera.x - W * 2);
    updateCamera(dt);
    updateSpeedStreaks(dt);
    updateConfetti(dt);

    if (this.finishPhase === "approaching") {
      var doorX = JOURNEY_TOTAL_DISTANCE - TUNING.finish.doorOffset;
      // decelerate toward a floor, not zero, so he visibly rides IN through
      // the door rather than crawling to a stop just short of it
      player.speed = Math.max(TUNING.finish.minEntrySpeed, player.speed - TUNING.finish.decelRate * dt);
      var slope = terrain.slope(player.x);
      var invNorm = 1 / Math.sqrt(1 + slope * slope);
      var Tx = invNorm, Ty = slope * invNorm;
      player.vx = Tx * player.speed;
      player.vy = Ty * player.speed;
      player.angle = Math.atan2(player.vy, player.vx);
      player.x = Math.min(player.x + player.vx * dt, doorX);
      player.y = terrain.y(player.x);
      player.state = "GROUNDED";

      if (player.x >= doorX) {
        this.finishPhase = "hidden";
        this.finishTimer = 0;
      }
    } else if (this.finishPhase === "hidden") {
      this.finishTimer += dt;
      if (this.finishTimer >= TUNING.finish.hiddenDuration) {
        this.finishPhase = "celebrating";
        this.finishTimer = 0;
        var wx = JOURNEY_TOTAL_DISTANCE + ASSETS.house.width * 0.08 + 23;
        var wy = terrain.y(JOURNEY_TOTAL_DISTANCE) - ASSETS.house.height + 39;
        spawnConfetti(wx, wy);
        this.spawnPopup("HOME!", wx, wy - 50, ASSETS.hud.perfectColor);
      }
    } else { // celebrating
      this.finishTimer += dt;
      if (this.finishTimer >= TUNING.finish.celebrateDuration) {
        this.state = "WIN";
        this.gameOverCooldown = 0.5;
        this.scoreRevealTimer = 0;
        this.isNewHighScore = saveHighScoreIfBetter(this.score);
      }
    }

    for (var i = this.popups.length - 1; i >= 0; i--) {
      var p = this.popups[i];
      p.life -= dt / 0.9;
      if (p.life <= 0) this.popups.splice(i, 1);
    }
  }
};

// ---------------------------------------------------------------------------
// input
// ---------------------------------------------------------------------------
// Hidden left/right touch split, with no on-screen indication: the right
// half is the original single "go fast / dive" button, the left half is a
// second hidden button (wheelie on the ground, air-tilt while airborne).
// activePointers tracks which zone each active touch/pointer started in,
// so multi-touch releases clear only the zone that pointer actually held.
var input = { leftPressed: false, rightPressed: false };
var activePointers = {};

function startGameIfNeeded() {
  if (game.state === "TITLE") {
    game.start();
    return true;
  }
  if (game.state === "GAMEOVER" || game.state === "WIN") {
    if (game.gameOverCooldown <= 0) game.start();
    return true;
  }
  return false;
}

canvas.addEventListener("pointerdown", function (e) {
  e.preventDefault();
  var rect = canvas.getBoundingClientRect();
  var x = e.clientX - rect.left, y = e.clientY - rect.top;
  if (isMuteButtonHit(x, y)) {
    soundMuted = !soundMuted;
    return;
  }
  if (startGameIfNeeded()) return;
  var zone = x < W / 2 ? "left" : "right";
  activePointers[e.pointerId] = zone;
  if (zone === "left") input.leftPressed = true;
  else input.rightPressed = true;
}, { passive: false });

function releasePointerZone(e) {
  var zone = activePointers[e.pointerId];
  if (!zone) return;
  delete activePointers[e.pointerId];
  var stillHeld = false;
  for (var id in activePointers) {
    if (activePointers[id] === zone) { stillHeld = true; break; }
  }
  if (stillHeld) return;
  if (zone === "left") input.leftPressed = false;
  else input.rightPressed = false;
}
window.addEventListener("pointerup", releasePointerZone);
window.addEventListener("pointercancel", releasePointerZone);
window.addEventListener("keydown", function (e) {
  if (e.code === "Space") {
    e.preventDefault();
    if (startGameIfNeeded()) return;
    input.rightPressed = true;
  }
});
window.addEventListener("keyup", function (e) {
  if (e.code === "Space") { e.preventDefault(); input.rightPressed = false; }
});

// ---------------------------------------------------------------------------
// main loop — fixed 120Hz physics step via accumulator
// ---------------------------------------------------------------------------
var lastTime = 0, accumulator = 0;
function frame(now) {
  var dt = Math.min((now - lastTime) / 1000, 0.25);
  lastTime = now;
  accumulator += dt;

  if (game.state === "GAMEOVER" || game.state === "WIN") {
    if (game.gameOverCooldown > 0) game.gameOverCooldown -= dt;
    game.scoreRevealTimer += dt;
  }

  while (accumulator >= TUNING.fixedDt) {
    game.update(TUNING.fixedDt);
    accumulator -= TUNING.fixedDt;
  }

  render();
  requestAnimationFrame(frame);
}

resize();
terrain.init();
terrain.ensureGenerated(4000);
initClouds();
camera.x = 0;
camera.y = terrain.y(0);
requestAnimationFrame(function (t) { lastTime = t; requestAnimationFrame(frame); });

})();
</script>
</body>
</html>
